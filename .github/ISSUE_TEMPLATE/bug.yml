name: Bug
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Version, OS, agent kind and version
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics
      description: Output of `agora doctor` (secrets are redacted automatically).

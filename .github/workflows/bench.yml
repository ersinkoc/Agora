name: bench

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark head
        run: cargo run -q --release -p agora-bench -- run --repeat 5 --secs 1 --commit "${{ github.sha }}" --out bench-head.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench-head.json
      # Regression gate (ADR-0022): on PRs, build the base commit and compare on the same runner.
      - name: Benchmark base and compare
        if: github.event_name == 'pull_request'
        run: |
          cp target/release/agora-bench ./agora-bench-head
          git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          if [ -d bench ]; then
            # A base from before --repeat existed does not know the flag; fall back to a single run.
            cargo run -q --release -p agora-bench -- run --repeat 5 --secs 1 --commit base --out bench-base.json \
              || cargo run -q --release -p agora-bench -- run --commit base --out bench-base.json
            ./agora-bench-head compare bench-base.json bench-head.json --threshold 10
          else
            echo "base has no bench harness yet; skipping comparison"
          fi

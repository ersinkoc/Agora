name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Toolchain version comes from rust-toolchain.toml (single source of truth).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A hang fails fast instead of holding the job for the runner's 6 hours (Windows hung 44 minutes twice): the step normally takes
      # 4-6 minutes. libtest names a test that runs past 60 s ("has been running for over 60 seconds"), and "Running <binary>" names
      # the test binary; the step after this one lists what was left running when the hang was a process holding the step's output.
      - run: cargo test --workspace
        timeout-minutes: 25
      - name: Processes left running (after a failure or a hang)
        if: failure()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            tasklist //v | grep -iE "agora|fake|deps|cargo|python|conhost" || true
          else
            ps -eo pid,ppid,etime,args | grep -E "agora|fake|/deps/|cargo|python" | grep -v grep || true
          fi
      - run: cargo run -q -p agora-i18n --bin i18n-lint

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-docs.sh
      - run: sh scripts/check-case.sh

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web
      - run: sh scripts/gen-ts.sh
      - name: Generated TypeScript matches the Rust wire layout
        working-directory: apps/web
        run: |
          node -e "import('./src/gen/agora.js').then(m=>{const P=m.agora.v1.Ping;const b=Array.from(P.encode(P.create({nonce:42})).finish());if(b.join()!=='8,42')process.exit(1)})"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web
      # Types and codecs for the protocol are generated from schema/ (ADR-0009), never committed.
      - run: npm run gen
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the hub, node and fake agent for Chromium
        env:
          AGORA_NO_EMBED_WEB: "1"
        run: cargo build --locked -p agora -p agora-fake-agent
      - name: Install Chromium
        env:
          PW_DIR: ${{ runner.temp }}/agora-playwright
        run: |
          npm install --prefix "$PW_DIR" --no-save --no-package-lock playwright-core@1.64.0
          "$PW_DIR/node_modules/.bin/playwright-core" install --with-deps --no-shell chromium
          chrome=$(node -p 'require(process.env.PW_DIR + "/node_modules/playwright-core").chromium.executablePath()')
          echo "PW_DIR=$PW_DIR" >> "$GITHUB_ENV"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Browser sign-in, terminal and signed approval
        run: node scripts/e2e-browser.mjs
        timeout-minutes: 5
      - name: Browser and nodes reconnect after a hub restart
        env:
          ROUNDS: "2"
          HUB_DOWN_MS: "0,15000"
          # Check that events reach the open browser after a restart with room for runner scheduling.
          LIMIT_MS: "60000"
        run: node scripts/e2e-hub-restart.mjs
        timeout-minutes: 5
      - name: A late or returning window gets the program's terminal modes (ADR-0100)
        run: node scripts/e2e-terminal-repaint.mjs
        timeout-minutes: 5
      - name: Settings knows a screen password set while the window was open (#909)
        run: node scripts/e2e-screen-password.mjs
        timeout-minutes: 5
      - name: A chat log keeps following its newest entry through a window or pane resize (#1060)
        run: node scripts/e2e-chat-follow-resize.mjs
        timeout-minutes: 5
      - name: Team chat still shows a message after a reload (ADR-0103)
        run: node scripts/e2e-team-chat-reload.mjs
        timeout-minutes: 5
      - name: A plugin installed on the hub is offered, shown with the grant the hub keeps, and gone once removed (ADR-0114)
        run: node scripts/e2e-plugin-hub.mjs
        timeout-minutes: 5
      - name: Two browsers of the same person see the same themes and theme choice through the hub (ADR-0113 step 4)
        run: node scripts/e2e-theme-sync.mjs
        timeout-minutes: 5

  schema-breaking:
    # A published message never changes (ADR-0006): compare schema/ with the target branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Reject edits to published fixtures
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --no-renames --exit-code --name-status --diff-filter=DMT "$BASE_SHA" HEAD -- schema/fixtures
      - name: Extract base schema
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p base/schema
          if git cat-file -e "$BASE_SHA:schema"; then
            git archive "$BASE_SHA" schema | tar -x -C base
          fi
      - run: cargo run -q -p agora-schema-check -- base/schema schema

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Toolchain version comes from rust-toolchain.toml (single source of truth).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A hang fails fast instead of holding the job for the runner's 6 hours (Windows hung 44 minutes twice): the step normally takes
      # 4-6 minutes. libtest names a test that runs past 60 s ("has been running for over 60 seconds"), and "Running <binary>" names
      # the test binary; the step after this one lists what was left running when the hang was a process holding the step's output.
      - run: cargo test --workspace
        timeout-minutes: 25
      - name: Processes left running (after a failure or a hang)
        if: failure()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            tasklist //v | grep -iE "agora|fake|deps|cargo|python|conhost" || true
          else
            ps -eo pid,ppid,etime,args | grep -E "agora|fake|/deps/|cargo|python" | grep -v grep || true
          fi
      - run: cargo run -q -p agora-i18n --bin i18n-lint

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/check-docs.sh

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web
      - run: sh scripts/gen-ts.sh
      - name: Generated TypeScript matches the Rust wire layout
        working-directory: apps/web
        run: |
          node -e "import('./src/gen/agora.js').then(m=>{const P=m.agora.v1.Ping;const b=Array.from(P.encode(P.create({nonce:42})).finish());if(b.join()!=='8,42')process.exit(1)})"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web
      # Types and codecs for the protocol are generated from schema/ (ADR-0009), never committed.
      - run: npm run gen
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  schema-breaking:
    # A published message never changes (ADR-0006): compare schema/ with the target branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Extract base schema
        run: |
          mkdir base
          git archive "${{ github.event.pull_request.base.sha }}" schema | tar -x -C base
      - run: cargo run -q -p agora-schema-check -- base/schema schema

name: desktop

# The desktop shell (ADR-0048) is its own Cargo workspace and needs a webview's system libraries, so it is built here and not in `ci`.
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "crates/agora-desktop-tunnel/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "crates/agora-desktop-tunnel/**", ".github/workflows/desktop.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --config apps/desktop/src-tauri/deny.toml
          command: check

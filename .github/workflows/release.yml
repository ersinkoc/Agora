name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    # The web app is built once and embedded into every binary (crates/agora/build.rs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci && npm run gen && npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: apps/web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release -p agora --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir dist
          cp "target/${{ matrix.target }}/release/agora$ext" "dist/agora-${{ matrix.target }}$ext"
          # The checksum `agora hub ssh install` verifies on the machine (ADR-0034): "<sha256>  <file>".
          cd dist
          f="agora-${{ matrix.target }}$ext"
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agora-${{ matrix.target }}
          path: dist/*

  publish:
    # Actions in this workflow are pinned to commits (it builds and signs what users install); bump them on purpose.
    # Attaches the binaries, their checksums and (when the release key is configured) their signatures to the release for
    # the tag. The key is a repository secret the maintainer provisions: an ssh ed25519 private key, whose public half the
    # owner of each hub pins in `<hub dir>/release-key` as an allowed_signers line for principal `agora-release`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: agora-*
          merge-multiple: true
      - name: Sign
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "no RELEASE_SIGNING_KEY: publishing checksums only"; exit 0; }
          umask 077; printf '%s\n' "$KEY" > key
          for f in dist/agora-*; do
            case "$f" in *.sha256|*.sig) continue;; esac
            ssh-keygen -Y sign -f key -n file "$f"
          done
          rm -f key
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, never pasted into the script: a tag name is chosen by whoever pushes it.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --repo "$REPO" --generate-notes

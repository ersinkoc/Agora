syntax = "proto3";

package agora.v1;

import "agora/v1/common.proto";
import "agora/v1/enroll.proto";

// Commands flow client -> hub -> node (docs/specs/protocol.md section 4). Every request has a request_id
// and an idempotency_key; the response is Ok or Err.
message CommandRequest {
  string request_id = 1;
  // A retried request with the same key must not repeat its effect.
  string idempotency_key = 2;
  // ADR-0029: the node that must run this command when it is sent to the hub. The hub forwards it to that node.
  string target_node = 3;

  oneof command {
    ProjectList project_list = 10;
    AgentStart agent_start = 11;
    AgentStop agent_stop = 12;
    AgentPrompt agent_prompt = 13;
    AgentSetMode agent_set_mode = 14;
    TerminalOpen terminal_open = 20;
    TerminalInput terminal_input = 21;
    TerminalResize terminal_resize = 22;
    TerminalSubscribe terminal_subscribe = 23;
    FilesList files_list = 30;
    FilesRead files_read = 31;
    FilesWrite files_write = 32;
    FilesWatch files_watch = 33;
    GitDiff git_diff = 40;
    GitStatus git_status = 41;
    WorktreeCreate worktree_create = 42;
    WorktreeRemove worktree_remove = 43;
    ApprovalResolve approval_resolve = 50;
    MeshPost mesh_post = 60;
    TaskUpdate task_update = 61;
    NodePolicyGet node_policy_get = 70;
    // ADR-0025
    AgentList agent_list = 15;
    // ADR-0030
    AgentKinds agent_kinds = 16;
    UsageReport usage_report = 17;
    // ADR-0037
    GitLog git_log = 18;
    // ADR-0038: opened on a dynamic stream like TerminalSubscribe; frames follow (kind 10 snapshot, kind 11 entry).
    ChatSubscribe chat_subscribe = 19;
    // ADR-0039: node -> hub, a mesh tool that touches a shared project's board.
    BoardCall board_call = 62;
    // ADR-0039 amendment B: hub → node only, when a project becomes shared.
    BoardJoin board_join = 66;
    // ADR-0041: user-signed grants for the commands a node's policy lists in `signed_commands`.
    GrantCreate grant_create = 63;
    GrantList grant_list = 64;
    GrantRevoke grant_revoke = 65;
    // ADR-0027: sent on a TLS connection that has no client certificate yet; accepts nothing else.
    EnrollRequest enroll = 80;
    // ADR-0052: existing published AgentStart keeps its worktree semantics.
    DirectoryInspect directory_inspect = 81;
    AgentLaunch agent_launch = 82;
    WorkspaceQuery workspace_query = 83;
    // ADR-0053: a folder picker's one question (node), and forgetting a closed agent (hub only).
    DirectoryList directory_list = 84;
    AgentForget agent_forget = 85;
  }
}

message CommandResponse {
  string request_id = 1;
  oneof result {
    CommandOk ok = 2;
    ErrorInfo err = 3;
  }
}

// Success. Commands that return data fill one of the results; the rest return `empty`.
message CommandOk {
  oneof result {
    Empty empty = 1;
    ProjectListResult project_list = 2;
    AgentStartResult agent_start = 3;
    TerminalOpenResult terminal_open = 4;
    FilesListResult files_list = 5;
    FilesReadResult files_read = 6;
    GitStatusResult git_status = 7;
    GitDiffResult git_diff = 8;
    WorktreeCreateResult worktree_create = 9;
    NodePolicyResult node_policy = 10;
    AgentListResult agent_list = 11;
    EnrollResponse enroll = 12;
    AgentKindsResult agent_kinds = 13;
    UsageReportResult usage_report = 14;
    GitLogResult git_log = 15;
    BoardResult board_result = 16;
    GrantListResult grant_list = 17;
    DirectoryInfo directory_info = 18;
    AgentLaunchResult agent_launch = 19;
    BoardJoinResult board_join = 20;
    DirectoryEntries directory_entries = 21;
  }
}

message Empty {}

// ---- requests ----

message ProjectList {}

message AgentStart {
  string project_id = 1;
  string node_id = 2;
  string kind = 3;
  // Empty means "create a new worktree"; otherwise reuse this one (opt-in sharing, uses leases).
  string worktree_id = 4;
  IntegrationLevel level = 5;
  string prompt = 6;
}

message AgentStop {
  string agent_id = 1;
}

message AgentPrompt {
  string agent_id = 1;
  string text = 2;
}

message AgentSetMode {
  string agent_id = 1;
  string mode = 2;
}

message TerminalOpen {
  string node_id = 1;
  string cwd = 2;
  TerminalPurpose purpose = 3;
  uint32 cols = 4;
  uint32 rows = 5;
}

message TerminalInput {
  string terminal_id = 1;
  bytes data = 2;
}

message TerminalResize {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TerminalSubscribe {
  string terminal_id = 1;
  // Capability name chosen at handshake: "terminal.raw" or "terminal.cells".
  string format = 2;
}

message FilesList {
  string worktree_id = 1;
  string path = 2;
}

message FilesRead {
  string worktree_id = 1;
  string path = 2;
}

message FilesWrite {
  string worktree_id = 1;
  string path = 2;
  bytes data = 3;
}

message FilesWatch {
  string worktree_id = 1;
  bool enable = 2;
}

message GitDiff {
  string worktree_id = 1;
  // Optional: limit to one path.
  string path = 2;
}

message GitStatus {
  string worktree_id = 1;
}

// ADR-0037: the recent commits of an agent's workspace, newest first.
message GitLog {
  string worktree_id = 1;
  // 0 means the default (30); the node caps it at 200.
  uint32 limit = 2;
}

message WorktreeCreate {
  string checkout_id = 1;
  string branch = 2;
}

message WorktreeRemove {
  string worktree_id = 1;
}

// Signed by the approving user's device key; the node verifies it (ADR-0020).
message ApprovalResolve {
  string approval_id = 1;
  bool approved = 2;
  string signer_device_id = 3;
  bytes signature = 4;
}

// ADR-0041. Signed by a trusted device (the same ES256 scheme as ApprovalResolve) over
// `agora-grant-v1 NUL node_id NUL grant_id NUL scope NUL commands (comma-joined) NUL expires_at_ms (decimal)`.
// `scope` is `node`, `agent:<id>` or `project:<id>`. The node verifies; a hub cannot forge one.
message GrantCreate {
  string grant_id = 1;
  string scope = 2;
  repeated string commands = 3;
  uint64 expires_at_ms = 4;
  string signer_device_id = 5;
  bytes signature = 6;
}

message GrantList {}

// Ending access needs no signature.
message GrantRevoke {
  string grant_id = 1;
}

message GrantInfo {
  string grant_id = 1;
  string scope = 2;
  repeated string commands = 3;
  uint64 expires_at_ms = 4;
  string signer_device_id = 5;
}

message GrantListResult {
  repeated GrantInfo grants = 1;
}

message MeshPost {
  // An agent on this node, or `<node>/<agent>` for one on another node (ADR-0031).
  string to = 1;
  string body = 2;
  // The node the hub saw this post arrive from. Set by the hub from the connection's certificate and overwritten if a node
  // wrote it; the receiving broker trusts only this value for where a message came from (ADR-0031).
  string origin = 3;
  // The sending agent's id on `origin`, as that node says it (a node can only vouch for its own agents).
  string from_agent = 4;
  // ADR-0035: the sender's refs (paths, commits, task ids) as written. The receiving broker stores each as `<origin>:<ref>`.
  repeated string refs = 5;
}

// ADR-0039. `tool` is one of task_list, task_create, task_claim, task_complete, lease_acquire, lease_release, handoff.
message BoardCall {
  string project_id = 1;
  string tool = 2;
  // The tool's arguments exactly as the agent gave them (a JSON object).
  string arguments_json = 3;
  // Set by the hub from the connection's certificate; a node cannot write it.
  string origin = 4;
  // The calling agent's id on this node (a node can only vouch for its own agents).
  string from_agent = 5;
}

// The hub's answer. `shared` is false when the project is not on two or more online nodes: nothing was done and the node
// runs the tool on its own broker. Otherwise `result_json` is the tool's result and `is_error` says whether it is a tool error
// (`{"code":..., "data":...}` like a local one).
message BoardResult {
  bool shared = 1;
  string result_json = 2;
  bool is_error = 3;
}

// ADR-0039 amendment B. The hub sends this to each online node with a checkout of `project_id` when the project becomes shared
// (gains its second such node). The node answers with its unfinished local work for the project and stops keeping it locally;
// the hub puts it on the board. Only the hub sends it; a client's is refused.
message BoardJoin {
  string project_id = 1;
}

message BoardJoinResult {
  repeated BoardJoinLease leases = 1;
  repeated BoardJoinTask tasks = 2;
}

// A path an agent of the answering node holds, until `expires_at_ms`.
message BoardJoinLease {
  string agent_id = 1;
  string path = 2;
  uint64 expires_at_ms = 3;
}

// A task that is open or claimed on the answering node. `owner_agent_id` is empty for an open task; `creator_agent_id` is the agent
// the board records as making it (any agent of the node in the project when the creator is gone).
message BoardJoinTask {
  string task_id = 1;
  string title = 2;
  string detail = 3;
  string owner_agent_id = 4;
  string creator_agent_id = 5;
}

message TaskUpdate {
  string task_id = 1;
  string project_id = 2;
  string title = 3;
  string claim_by_agent_id = 4;
  bool done = 5;
}

message NodePolicyGet {
  string node_id = 1;
}

// ---- results ----

message ProjectSummary {
  string project_id = 1;
  string name = 2;
}

message ProjectListResult {
  repeated ProjectSummary projects = 1;
}

message AgentStartResult {
  string agent_id = 1;
  string terminal_id = 2;
  string worktree_id = 3;
}

message TerminalOpenResult {
  string terminal_id = 1;
}

message FileEntry {
  string name = 1;
  bool is_dir = 2;
  uint64 size_bytes = 3;
}

message FilesListResult {
  repeated FileEntry entries = 1;
}

message FilesReadResult {
  bytes data = 1;
}

message GitStatusResult {
  uint32 files_changed = 1;
  uint32 insertions = 2;
  uint32 deletions = 3;
  string head_commit = 4;
}

message ChatSubscribe {
  string agent_id = 1;
}

enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_AGENT = 1;
  CHAT_ROLE_USER = 2;
}

enum ChatKind {
  CHAT_KIND_UNSPECIFIED = 0;
  CHAT_KIND_TEXT = 1;
  CHAT_KIND_TOOL_CALL = 2;
  CHAT_KIND_PLAN = 3;
  CHAT_KIND_DIFF = 4;
}

// One line of an agent's conversation (ADR-0038). Untrusted text: a model or a person wrote it.
message ChatEntry {
  // Increases per agent; a client ignores one it already has.
  uint64 entry_id = 1;
  uint64 at_ms = 2;
  ChatRole role = 3;
  ChatKind kind = 4;
  // Text; tool name and arguments as JSON; plan lines joined by "\n"; or the unified diff.
  string text = 5;
  // For a diff: the file.
  string path = 6;
}

message ChatSnapshot {
  repeated ChatEntry entries = 1;
}

message GitCommit {
  string id = 1;
  string subject = 2;
  string author = 3;
  uint64 at_ms = 4;
}

message GitLogResult {
  repeated GitCommit commits = 1;
}

message GitDiffResult {
  // Unified diff.
  string diff = 1;
}

message WorktreeCreateResult {
  string worktree_id = 1;
  string path = 2;
}

message NodePolicyResult {
  // Commands that require a user-signed approval on this node.
  repeated string approval_required = 1;
  repeated string allowed_agent_kinds = 2;
}

// ---- ADR-0025: agent.list ----

// An empty node_id means this node.
message AgentList {
  string node_id = 1;
}

message AgentSummary {
  string agent_id = 1;
  string kind = 2;
  AgentState state = 3;
  string worktree_id = 4;
  // Empty for an agent with no terminal (an L3 adapter agent).
  string terminal_id = 5;
  bool running = 6;
  uint32 restarts = 7;
}

message AgentListResult {
  repeated AgentSummary agents = 1;
}

// ADR-0030: which agents this node can start.
message AgentKinds {}

message AgentKind {
  // What AgentStart.kind takes.
  string kind = 1;
  string display_name = 2;
  IntegrationLevel level = 3;
  // Whether the launch program is found on this node.
  bool installed = 4;
}

message AgentKindsResult {
  repeated AgentKind kinds = 1;
}

// ADR-0033. Answered by the hub itself from its view and price table; never routed to a node.
message UsageReport {}

message AgentUsage {
  // The hub-wide key <node>/<agent>.
  string agent_id = 1;
  // As the agent reported it; empty when it never did.
  string model = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  // Estimated cost in micro-USD (1 USD = 1_000_000). Absent when no price is known: never a guess.
  optional uint64 micro_usd = 5;
}

message UsageReportResult {
  repeated AgentUsage agents = 1;
  // Sum of the estimates above; agents without a price add nothing.
  uint64 total_micro_usd = 2;
  // When the price table was refreshed, ms since the epoch; 0 for the table bundled with the release.
  uint64 prices_at_ms = 3;
}

// ADR-0052: signed only on the routed path; owner-only local control needs no signature.
// Domain-separated canonical bytes are specified in docs/specs/protocol.md.
message DirectoryAuthorization {
  string device_id = 1;
  string nonce = 2;
  uint64 expires_at_ms = 3;
  bytes signature = 4;
}
message DirectoryInspect {
  string path = 1;
  // Explicit user action: create metadata only if absent, never overwrite it or commit it.
  bool create_project_id = 2;
  DirectoryAuthorization authorization = 3;
}
message DirectoryInfo {
  string path = 1;
  string project_id = 2;
  string git_root = 3;
  string branch = 4;
  bool portable = 5;
  string previous_project_id = 6;
}
// ADR-0053. Lists the sub-folders of one folder on a node: names only, never files. `path` empty means the user's home folder.
message DirectoryList {
  string path = 1;
  DirectoryAuthorization authorization = 2;
}
message DirectoryEntry {
  string name = 1;
  bool is_git = 2;
}
message DirectoryEntries {
  // The canonical folder the node resolved, and its parent (empty at a root).
  string path = 1;
  string parent = 2;
  repeated DirectoryEntry entries = 3;
  // More folders exist than the node answers with (at most 500 per answer).
  bool truncated = 4;
}
// ADR-0053. The hub stops listing a closed agent. Answered by the hub; refused with `agent.running` while the agent runs.
message AgentForget {
  string agent_id = 1;
}

message AgentLaunch {
  string path = 1;
  string project_id = 2;
  string kind = 3;
  bool separate_worktree = 4;
  DirectoryAuthorization authorization = 5;
  bool accept_identity_change = 6;
}
message AgentLaunchResult {
  string agent_id = 1;
  string terminal_id = 2;
  string workspace_id = 3;
  string path = 4;
}

// Read-only operations over registered workspaces. Results use the existing data-only result messages.
message WorkspaceQuery {
  string workspace_id = 1;
  // list, read, status, diff, history
  string operation = 2;
  string path = 3;
  uint32 limit = 4;
}

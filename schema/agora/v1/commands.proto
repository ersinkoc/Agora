syntax = "proto3";

package agora.v1;

import "agora/v1/common.proto";
import "agora/v1/devices.proto";
import "agora/v1/enroll.proto";
import "agora/v1/events.proto";
import "agora/v1/pairing.proto";
import "agora/v1/plugins.proto";
import "agora/v1/preview.proto";
import "agora/v1/settings.proto";
import "agora/v1/share.proto";

// Commands flow client -> hub -> node (docs/specs/protocol.md section 4). Every request has a request_id
// and an idempotency_key; the response is Ok or Err.
message CommandRequest {
  string request_id = 1;
  // A retried request with the same key must not repeat its effect.
  string idempotency_key = 2;
  // ADR-0029: the node that must run this command when it is sent to the hub. The hub forwards it to that node.
  string target_node = 3;

  oneof command {
    ProjectList project_list = 10;
    AgentStart agent_start = 11;
    AgentStop agent_stop = 12;
    AgentPrompt agent_prompt = 13;
    AgentSetMode agent_set_mode = 14;
    TerminalOpen terminal_open = 20;
    TerminalInput terminal_input = 21;
    TerminalResize terminal_resize = 22;
    TerminalSubscribe terminal_subscribe = 23;
    FilesList files_list = 30;
    FilesRead files_read = 31;
    FilesWrite files_write = 32;
    FilesWatch files_watch = 33;
    GitDiff git_diff = 40;
    GitStatus git_status = 41;
    WorktreeCreate worktree_create = 42;
    WorktreeRemove worktree_remove = 43;
    ApprovalResolve approval_resolve = 50;
    MeshPost mesh_post = 60;
    TaskUpdate task_update = 61;
    NodePolicyGet node_policy_get = 70;
    // ADR-0025
    AgentList agent_list = 15;
    // ADR-0030
    AgentKinds agent_kinds = 16;
    UsageReport usage_report = 17;
    // ADR-0037
    GitLog git_log = 18;
    // ADR-0038: opened on a dynamic stream like TerminalSubscribe; frames follow (kind 10 snapshot, kind 11 entry).
    ChatSubscribe chat_subscribe = 19;
    // ADR-0039: node -> hub, a mesh tool that touches a shared project's board.
    BoardCall board_call = 62;
    // ADR-0039 amendment B: hub → node only, when a project becomes shared.
    BoardJoin board_join = 66;
    // ADR-0041: user-signed grants for the commands a node's policy lists in `signed_commands`.
    GrantCreate grant_create = 63;
    GrantList grant_list = 64;
    GrantRevoke grant_revoke = 65;
    // ADR-0027: sent on a TLS connection that has no client certificate yet; accepts nothing else.
    EnrollRequest enroll = 80;
    // ADR-0052: existing published AgentStart keeps its worktree semantics.
    DirectoryInspect directory_inspect = 81;
    AgentLaunch agent_launch = 82;
    WorkspaceQuery workspace_query = 83;
    // ADR-0053: a folder picker's one question (node), and forgetting a closed agent (hub only).
    DirectoryList directory_list = 84;
    AgentForget agent_forget = 85;
    // ADR-0058: sent only to a node with the capability `agent.set_model`.
    AgentSetModel agent_set_model = 86;
    // ADR-0060: sent only to a node with the capability `agent.resume`.
    AgentResume agent_resume = 87;
    // ADR-0061 (87 is ADR-0060's): devices. `DeviceRegister`, `DeviceList` and `DeviceAskApproval` are answered by the hub;
    // `DeviceEndorse` and `DeviceRevoke` a client sends to the hub, which carries them to the nodes with the capability `device.trust`.
    DeviceRegister device_register = 88;
    DeviceList device_list = 89;
    DeviceEndorse device_endorse = 90;
    DeviceRevoke device_revoke = 91;
    DeviceAskApproval device_ask_approval = 92;
    // ADR-0073: answered by the hub (owner only, capability `node.forget`); refused with `node.online` while the machine is connected.
    NodeForget node_forget = 93;
    // ADR-0065, capability `pairing.v1`. The owner's switch and decision (hub only); the machine's two messages are accepted
    // only on a pairing connection, like `enroll` (docs/specs/pairing.md).
    PairOpen pair_open = 94;
    PairClose pair_close = 95;
    PairStatus pair_status = 96;
    PairApprove pair_approve = 97;
    PairDeny pair_deny = 98;
    PairRequest pair_request = 99;
    PairReveal pair_reveal = 100;
    // ADR-0082: the first request on a node's local control socket when the node requires its control token; accepted on no other path.
    ControlAuth control_auth = 101;
    // ADR-0088, capability `preview.v1` (offered by the node and hub once they handle these; not yet): forwards to a port on a node's loopback. `PreviewConnect` is opened on a dynamic stream.
    PreviewOpen preview_open = 102;
    PreviewClose preview_close = 103;
    PreviewList preview_list = 104;
    PreviewConnect preview_connect = 105;
    // ADR-0090, sent only to a node with the capability `agent.set_config` (a hub refuses it for any other node).
    AgentSetConfig agent_set_config = 106;
    // ADR-0090, sent only to a node with the capability `agent.cancel_turn` (a hub refuses it for any other node).
    AgentCancelTurn agent_cancel_turn = 107;
    // ADR-0085: renew this machine's certificate; only on the machine's own authenticated connection, capability `enroll.renew`.
    RenewRequest renew = 108;
    // ADR-0095, sent only to a node with the capability `task.dispatch` (a hub refuses it for any other node).
    TaskDispatch task_dispatch = 109;
    // ADR-0109: the hub sends this only to a node after negotiating `mesh.task_handoff.v1`.
    DeliverTaskHandoff deliver_task_handoff = 110;
    // ADR-0113 decision 6: the community theme catalog the hub keeps. Answered by the hub itself (no `target_node`); any signed-in
    // person may ask.
    ThemeCatalogList theme_catalog_list = 111;
    ThemeCatalogGet theme_catalog_get = 112;
    // ADR-0114 decision 6: plugins kept by the hub and each person's grants (plugins.proto). Answered by the hub; they name no node.
    PluginList plugin_list = 113;
    PluginFetch plugin_fetch = 114;
    PluginGrantList plugin_grant_list = 115;
    PluginGrantSet plugin_grant_set = 116;
    PluginGrantRemove plugin_grant_remove = 117;
    // ADR-0113 decision 6 (step 4): the caller's own settings value the hub keeps opaque (settings.proto). Answered by the hub for any
    // signed-in person; they name no node.
    UserSettingsGet user_settings_get = 118;
    UserSettingsSet user_settings_set = 119;
    // ADR-0114 decision 7 (step 4): the community plugin catalog, read only (plugins.proto). Answered by the hub for any signed-in
    // person; it names no node.
    PluginCatalogList plugin_catalog_list = 120;
    // ADR-0120: one screenshot of a plugin in the community catalog (plugins.proto). Answered by the hub for any signed-in person.
    PluginCatalogScreenshot plugin_catalog_screenshot = 121;
    // ADR-0119, capability `mesh.spawn.remote` (named; no node or hub offers it until build steps 2 to 4): a helper started on another
    // machine. Each comes only from a node's connection; the hub writes `origin` (and `from_node` on a result) from certificates.
    HelperStart helper_start = 122;
    HelperStartResult helper_start_result = 123;
    HelperFollow helper_follow = 124;
    HelperRelease helper_release = 125;
    // ADR-0121: the signed-in owner clears an unresolved reservation on the hub.
    AcknowledgeTaskHandoff acknowledge_task_handoff = 126;
    // ADR-0122, capability `share.items` (named; offered by no one until the build steps): shared skills and MCP servers. The first
    // three are the hub's (publish and remove owner only, each signed by the owner's device); the fourth comes only from a node.
    ShareItemPublish share_item_publish = 127;
    ShareItemList share_item_list = 128;
    ShareItemRemove share_item_remove = 129;
    ShareItemGet share_item_get = 130;
    // ADR-0125: these commands are answered by the hub and name no target node.
    TaskReviewRead task_review_read = 131;
    TaskReviewDecide task_review_decide = 132;
    // ADR-0128: the hub queues an accepted report notice to a verified parent run.
    DeliverTaskAcceptanceNotice deliver_task_acceptance_notice = 133;
  }
}

message CommandResponse {
  string request_id = 1;
  oneof result {
    CommandOk ok = 2;
    ErrorInfo err = 3;
  }
}

// Success. Commands that return data fill one of the results; the rest return `empty`.
message CommandOk {
  oneof result {
    Empty empty = 1;
    ProjectListResult project_list = 2;
    AgentStartResult agent_start = 3;
    TerminalOpenResult terminal_open = 4;
    FilesListResult files_list = 5;
    FilesReadResult files_read = 6;
    GitStatusResult git_status = 7;
    GitDiffResult git_diff = 8;
    WorktreeCreateResult worktree_create = 9;
    NodePolicyResult node_policy = 10;
    AgentListResult agent_list = 11;
    EnrollResponse enroll = 12;
    AgentKindsResult agent_kinds = 13;
    UsageReportResult usage_report = 14;
    GitLogResult git_log = 15;
    BoardResult board_result = 16;
    GrantListResult grant_list = 17;
    DirectoryInfo directory_info = 18;
    AgentLaunchResult agent_launch = 19;
    BoardJoinResult board_join = 20;
    DirectoryEntries directory_entries = 21;
    // ADR-0061
    DeviceListResult device_list = 22;
    // ADR-0065
    PairChallenge pair_challenge = 23;
    PairResult pair_result = 24;
    PairStatusResult pair_status = 25;
    // ADR-0088
    PreviewOpenResult preview_open = 26;
    PreviewListResult preview_list = 27;
    PreviewConnectResult preview_connect = 28;
    // ADR-0090: the answer to `AgentPrompt` from a node with the capability `chat.rich`.
    AgentPromptResult agent_prompt = 29;
    // ADR-0085
    RenewResponse renew = 30;
    // ADR-0095: the answer to `TaskDispatch`.
    TaskDispatchResult task_dispatch = 31;
    // ADR-0109: the node has durably accepted a `DeliverTaskHandoff`.
    TaskHandoffReceipt task_handoff_receipt = 32;
    // ADR-0113 decision 6: the answers to `ThemeCatalogList` and `ThemeCatalogGet`.
    ThemeCatalogListResult theme_catalog_list = 33;
    ThemeCatalogTheme theme_catalog_theme = 34;
    // ADR-0114 decision 6
    PluginListResult plugin_list = 35;
    PluginFetchResult plugin_fetch = 36;
    PluginGrantListResult plugin_grant_list = 37;
    // ADR-0113 decision 6 (step 4): the answer to `UserSettingsGet` and `UserSettingsSet`.
    UserSettingsValue user_settings = 38;
    // ADR-0114 decision 7 (step 4): the answer to `PluginCatalogList`.
    PluginCatalogListResult plugin_catalog_list = 39;
    // ADR-0120: the answer to `PluginCatalogScreenshot`.
    PluginCatalogScreenshotResult plugin_catalog_screenshot = 40;
    // ADR-0119: the target's first answer to a forwarded `HelperStart`, and its answer to `HelperFollow`.
    HelperStartAccepted helper_start_accepted = 41;
    HelperFollowResult helper_follow_result = 42;
    // ADR-0122: the answers to `ShareItemList` and `ShareItemGet`.
    ShareItemListResult share_item_list = 43;
    ShareItemGetResult share_item_get = 44;
    TaskReviewReport task_review_report = 45; // ADR-0125.
    TaskAcceptanceNoticeReceipt task_acceptance_notice_receipt = 46; // ADR-0128.
  }
}

message Empty {}

// ---- requests ----

message ProjectList {}

message AgentStart {
  string project_id = 1;
  string node_id = 2;
  string kind = 3;
  // Empty means "create a new worktree"; otherwise reuse this one (opt-in sharing, uses leases).
  string worktree_id = 4;
  IntegrationLevel level = 5;
  string prompt = 6;
  // ADR-0059: ids of the kind's `[[launch.option]]`s to start with (capability `agent.launch_options`). Accepted only on the
  // node's own control socket; routed through the hub such a start is refused (it carries no signature), use `AgentLaunch`.
  repeated string launch_options = 7;
  // ADR-0059: the chosen ids whose "act without asking" confirmation the window showed and the user accepted. The node, from its own
  // manifest, refuses an option that skips permissions unless it is listed here (`agent.option_unconfirmed`).
  repeated string confirmed_launch_options = 8;
  // ADR-0066: values for the kind's `[[launch.setting]]`s (model, effort, ...), at most one per id. Accepted only on the node's own
  // control socket; routed through the hub such a start is refused (it carries no signature) until the signed path covers them.
  repeated LaunchSetting settings = 9;
}

message AgentStop {
  string agent_id = 1;
  // ADR-0057: also stop the helpers this agent started (and theirs). Old nodes ignore it and stop only this agent.
  bool stop_helpers = 2;
}

message AgentPrompt {
  string agent_id = 1;
  string text = 2;
}

// ADR-0090: what a node with the capability `chat.rich` answers to `AgentPrompt` instead of `empty`: whether the prompt was
// sent to the agent now or queued behind the turn that runs. A node without the capability answers `empty` (read as sent).
message AgentPromptResult {
  // True: the agent is in a turn, so the prompt waits (the user entry carries `ChatEntry.queued` until it is sent).
  bool queued = 1;
  // How many prompts wait for this agent now, this one included; 0 when it was sent. At most `MAX_PROMPT_QUEUE` (8, ADR-0090).
  uint32 queue_len = 2;
}

// ADR-0090: set one of the options the agent reported in `AgentSessionConfig` (the reasoning effort is the option with category
// `SESSION_CONFIG_CATEGORY_THOUGHT_LEVEL`). `config_id` and `value` are checked against the agent's last report; `value` is the id
// of a choice for a select and "true" or "false" for a boolean. Works between turns, and during a turn if the agent accepts it.
// Unlike `AgentSetMode`, a client never sends it for an option with `skips_permissions` without the user's confirmation, and the
// node refuses such an option when its policy forbids it, whatever category the agent gave it.
message AgentSetConfig {
  string agent_id = 1;
  string config_id = 2;
  string value = 3;
}

// ADR-0090: end the agent's current turn (ACP `session/cancel`); the agent process lives on and returns to idle. Not `AgentStop`.
// Not signed: it ends no process and widens nothing; it needs the sender's access to the agent, like `AgentPrompt`.
message AgentCancelTurn {
  string agent_id = 1;
  // Also throw away the prompts queued behind the turn. Unset: they are kept and sent in order after the cancelled turn.
  bool drop_queue = 2;
}

// ADR-0058: `mode` is the id of one of the modes the agent reported (`AgentSessionOptions`). Sent only to a node with the
// capability `agent.set_mode`.
message AgentSetMode {
  string agent_id = 1;
  string mode = 2;
}

// ADR-0058: `model` is the id of one of the models the agent reported (`AgentSessionOptions`).
message AgentSetModel {
  string agent_id = 1;
  string model = 2;
}

message TerminalOpen {
  string node_id = 1;
  string cwd = 2;
  TerminalPurpose purpose = 3;
  uint32 cols = 4;
  uint32 rows = 5;
}

message TerminalInput {
  string terminal_id = 1;
  bytes data = 2;
}

message TerminalResize {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TerminalSubscribe {
  string terminal_id = 1;
  // Capability name chosen at handshake: "terminal.raw" or "terminal.cells".
  string format = 2;
  // ADR-0100: how many lines of history the window wants before the repaint (kind 4 frames); 0 or absent: none (as before).
  uint32 history_lines = 3;
}

message FilesList {
  string worktree_id = 1;
  string path = 2;
}

message FilesRead {
  string worktree_id = 1;
  string path = 2;
}

message FilesWrite {
  string worktree_id = 1;
  string path = 2;
  bytes data = 3;
}

message FilesWatch {
  string worktree_id = 1;
  bool enable = 2;
}

message GitDiff {
  string worktree_id = 1;
  // Optional: limit to one path.
  string path = 2;
}

message GitStatus {
  string worktree_id = 1;
}

// ADR-0037: the recent commits of an agent's workspace, newest first.
message GitLog {
  string worktree_id = 1;
  // 0 means the default (30); the node caps it at 200.
  uint32 limit = 2;
}

message WorktreeCreate {
  string checkout_id = 1;
  string branch = 2;
}

message WorktreeRemove {
  string worktree_id = 1;
}

// Signed by the approving user's device key; the node verifies it (ADR-0020).
message ApprovalResolve {
  string approval_id = 1;
  bool approved = 2;
  string signer_device_id = 3;
  bytes signature = 4;
  // ADR-0057, only for an approved `agent.start`: allow the asking agent up to this many helpers of the same kind in the same
  // folder while it runs, this start included (0: this start only). Revoked with `GrantRevoke { grant_id: approval_id }`.
  uint32 helper_grant = 5;
  // ADR-0057, only for an approved `agent.start`: the helpers started under this decision may themselves ask to start helpers
  // (each such start still needs its own approval; never deeper than that).
  bool helpers_may_start = 6;
  // For an `agent.start` approval the signature is not over the ADR-0028 message but over
  // `agora-approval-start-v1 NUL node_id NUL approval_id NUL verdict NUL helper_grant NUL helpers_may_start NUL
  // sha256(detail)` (verdict and helpers_may_start as ASCII `0`/`1`, helper_grant in decimal, the hash of the request's `detail` in lowercase hex): the decision binds what the user saw (kind, node, folder, asking agent,
  // the first prompt), so a hub can neither swap the prompt nor add or remove a grant.
  // ADR-0090 Amendment A: for an `agent.skip_permissions` approval the signature is over the domain `agora-approval-skip-v1`, one NUL,
  // then F(node_id) F(approval_id) F(verdict) F(agent_id) F(option_id) F(value) F(sha256(detail)), where F(x) is the decimal byte
  // length of x, `:`, then x (docs/specs/protocol.md). `helper_grant` and `helpers_may_start` must be 0 and false there. The node
  // applies the option and value it rendered, never anything the decision carries.
  // ADR-0101: how far the answer reaches. UNSPECIFIED and ONCE are signed over the message above; ALWAYS (only with `approved`, only
  // on a request whose `scopes` offer it, never on an `agent.` request) over `agora-approval-always-v1`, one NUL, then
  // F(node_id) F(approval_id) F(verdict) F(agent_id) F(sha256(action)) F(sha256(detail)) F(always_label) F(always_option_id)
  // (docs/specs/protocol.md). Any other value is refused.
  ApprovalScope scope = 7;
  // ADR-0119 decision 12, only for an approved `agent.start.remote`: the standing grant the person gives (absent or `max_running` 0:
  // this start only). `helper_grant` and `helpers_may_start` must be 0 and false on that action. Signed over `agora-approval-start-v4`
  // (docs/specs/protocol.md).
  RemoteGrant remote_grant = 8;
}

// ADR-0041. Signed by a trusted device (the same ES256 scheme as ApprovalResolve) over
// `agora-grant-v1 NUL node_id NUL grant_id NUL scope NUL commands (comma-joined) NUL expires_at_ms (decimal)`.
// `scope` is `node`, `agent:<id>` or `project:<id>`. The node verifies; a hub cannot forge one.
message GrantCreate {
  string grant_id = 1;
  string scope = 2;
  repeated string commands = 3;
  uint64 expires_at_ms = 4;
  string signer_device_id = 5;
  bytes signature = 6;
}

message GrantList {}

// Ending access needs no signature.
message GrantRevoke {
  string grant_id = 1;
}

message GrantInfo {
  string grant_id = 1;
  string scope = 2;
  repeated string commands = 3;
  uint64 expires_at_ms = 4;
  string signer_device_id = 5;
  // ADR-0057: a helper grant (`commands` is `mesh.agent_start`, `scope` is `agent:<asking agent>`, `grant_id` the approval id,
  // `expires_at_ms` 0: it ends when the asking agent exits or is stopped). The kind and folder it covers and the starts it has left.
  string kind = 6;
  string folder = 7;
  uint32 remaining = 8;
}

// ADR-0119 decision 12: a standing grant on this node for starts from another machine, listed apart from `GrantInfo` (in
// `GrantListResult.remote_grants`) so a window from before it never reads one as a used-up local grant. `origin_node` and the root
// are the hub's word (it writes them), `origin_agent` the asking machine's.
message RemoteGrantInfo {
  string grant_id = 1;
  string signer_device_id = 2;
  string origin_node = 3;
  string origin_agent = 4;
  string root_node = 5;
  string root_agent = 6;
  // The kind asked (any integrated kind with `any_kind`) and the folder (and below it with `below_folder`).
  string kind = 7;
  string folder = 8;
  bool any_kind = 9;
  bool below_folder = 10;
  bool chain = 11;
  uint32 max_running = 12;
  uint32 running = 13;
  uint32 starts_this_hour = 14;
  uint64 until_ms = 15;
}

// ADR-0119 decision 12: the scope of a standing grant the person gives on an `agent.start.remote` card, signed field by field over
// `agora-approval-start-v4`. The kind, the folder and the asker it covers are the target's own rendered request, never this message.
message RemoteGrant {
  // How many helpers started under the grant may run at once on the target (1..20). 0: no grant (this start only).
  uint32 max_running = 1;
  // Any kind the target has with an agent integration, not only the kind asked.
  bool any_kind = 2;
  // The folder asked and every folder below it, not only the folder asked.
  bool below_folder = 3;
  // Every agent of the chain the asker roots may ask under it (from any machine of the hub), not only the asking run.
  bool chain = 4;
  // When it ends (milliseconds since the epoch), at most 24 hours after the decision; 0: 24 hours after the decision. It also ends when
  // the root run ends.
  uint64 until_ms = 5;
}

// ADR-0119 decision 1: node -> hub -> target. An agent of the sending node asks another machine to start a helper.
message HelperStart {
  // 16 random bytes the asking node chose; names this start in the result and a release.
  bytes start_id = 1;
  string target_node = 2;
  string kind = 3;
  // A full path on the target.
  string folder = 4;
  string prompt = 5;
  bool worktree = 6;
  repeated LaunchSetting settings = 7;
  repeated string launch_options = 8;
  // The asking agent and its run (ADR-0109), the asking node's word.
  string from_agent = 9;
  bytes from_run_id = 10;
  // The asking machine, written by the hub from the connection's certificate (whatever the node sent).
  string origin = 11;
  // How deep the asker is in its chain (0: a person started it; at most 3 may ask) and the chain's root. Written by the hub, like
  // `origin`, from its own record of the cross-machine starts it carried: an asker the hub did not carry a start for is depth 0 and
  // its own root, whatever the node sent (a local helper's depth below that is the asking node's own limit).
  uint32 depth = 12;
  string root_node = 13;
  string root_agent = 14;
  bytes root_run_id = 15;
  // The asking agent's kind, for the card ("Claude Code on mac wants to start ..."): the asking node's word.
  string from_agent_kind = 16;
}

// ADR-0119 decision 5: the target raised its card (or found a grant that covers the start). `granted` with `grant_id`: no card; the
// result follows as soon as the helper runs.
message HelperStartAccepted {
  string approval_id = 1;
  uint64 ttl_ms = 2;
  bool granted = 3;
  string grant_id = 4;
}

// ADR-0119 decision 6: target -> hub -> asking node, when the start was decided, expired or failed to launch.
message HelperStartResult {
  bytes start_id = 1;
  // The asking machine (`origin` of the start).
  string to_node = 2;
  // The helper on the target, and its terminal; empty with `error`.
  string agent_id = 3;
  string terminal_id = 4;
  ErrorInfo error = 5;
  // The target, written by the hub from the connection's certificate.
  string from_node = 6;
}

// ADR-0119 decision 7: asking node -> hub -> target, for `agent_wait` and `agent_output` on a helper there.
message HelperFollow {
  // The helper on the target.
  string agent_id = 1;
  string from_agent = 2;
  bytes from_run_id = 3;
  // The asking machine, written by the hub.
  string origin = 4;
  // `idle`, `working`, `blocked`, `done` or `exited`; empty: answer at once.
  string wait_state = 5;
  // At most 20000, so each answer fits in a forward's deadline.
  uint32 wait_ms = 6;
  // Lines of output wanted (0: none, at most 200).
  uint32 lines = 7;
}

message HelperFollowResult {
  string state = 1;
  repeated string lines = 2;
  // `screen` or `transcript`, when lines were asked.
  string source = 3;
}

// ADR-0119 decision 8: asking node -> hub -> target, when the asker's call ends, the asker exits, or a person stops it.
message HelperRelease {
  string from_agent = 1;
  bytes from_run_id = 2;
  // Set: withdraw the card of this start. Empty: the asker is gone (its cards are withdrawn and its right to follow ends).
  bytes start_id = 3;
  // A person stopped the asker with its helpers: stop that run's helpers on the target too, and theirs.
  bool stop_helpers = 4;
  // The asking machine, written by the hub.
  string origin = 5;
}

message GrantListResult {
  repeated GrantInfo grants = 1;
  // ADR-0119: the node's standing grants for starts from other machines.
  repeated RemoteGrantInfo remote_grants = 2;
}

message MeshPost {
  // An agent on this node, or `<node>/<agent>` for one on another node (ADR-0031).
  string to = 1;
  string body = 2;
  // The node the hub saw this post arrive from. Set by the hub from the connection's certificate and overwritten if a node
  // wrote it; the receiving broker trusts only this value for where a message came from (ADR-0031).
  string origin = 3;
  // The sending agent's id on `origin`, as that node says it (a node can only vouch for its own agents).
  string from_agent = 4;
  // ADR-0035: the sender's refs (paths, commits, task ids) as written. The receiving broker stores each as `<origin>:<ref>`.
  repeated string refs = 5;
}

// ADR-0039. `tool` is one of task_list, task_create, task_claim, task_complete, lease_acquire, lease_release, handoff.
// ADR-0112: `tool` may also be `fleet_status`, with `project_id` empty and `arguments_json` `{}`, answered by a hub with the capability
// `mesh.fleet_status.v1`: `BoardResult.shared` true and `result_json` the machines whose link agreed on that capability and their
// running agents (docs/specs/mesh-tools.md), or the tool error `board.not_allowed` on a hub with people besides the owner whose owner
// has not turned it on.
message BoardCall {
  string project_id = 1;
  string tool = 2;
  // The tool's arguments exactly as the agent gave them (a JSON object).
  string arguments_json = 3;
  // Set by the hub from the connection's certificate; a node cannot write it.
  string origin = 4;
  // The calling agent's id on this node (a node can only vouch for its own agents).
  string from_agent = 5;
}

// The hub's answer. `shared` is false when the project is not on two or more online nodes: nothing was done and the node
// runs the tool on its own broker. Otherwise `result_json` is the tool's result and `is_error` says whether it is a tool error
// (`{"code":..., "data":...}` like a local one).
message BoardResult {
  bool shared = 1;
  string result_json = 2;
  bool is_error = 3;
}

// ADR-0039 amendment B. The hub sends this to each online node with a checkout of `project_id` when the project becomes shared
// (gains its second such node). The node answers with its unfinished local work for the project and stops keeping it locally;
// the hub puts it on the board. Only the hub sends it; a client's is refused.
message BoardJoin {
  string project_id = 1;
}

message BoardJoinResult {
  repeated BoardJoinLease leases = 1;
  repeated BoardJoinTask tasks = 2;
}

// A path an agent of the answering node holds, until `expires_at_ms`.
message BoardJoinLease {
  string agent_id = 1;
  string path = 2;
  uint64 expires_at_ms = 3;
}

// A task that is open or claimed on the answering node. `owner_agent_id` is empty for an open task; `creator_agent_id` is the agent
// the board records as making it (any agent of the node in the project when the creator is gone).
message BoardJoinTask {
  string task_id = 1;
  string title = 2;
  string detail = 3;
  string owner_agent_id = 4;
  string creator_agent_id = 5;
}

message TaskUpdate {
  string task_id = 1;
  string project_id = 2;
  string title = 3;
  string claim_by_agent_id = 4;
  bool done = 5;
}

// ADR-0095 decision 3: a person gives an open task of a project to an agent of that project on the receiving node. The node claims the
// task for the agent where the project's board is (its own broker, or the hub's board for a shared project, as the agent's own
// `task_claim` would), sends the agent one prompt built from the node's template around the task's title and detail (marked as untrusted
// task data, decision 5), never typed over a running turn, and records `TaskDispatched`. If the prompt cannot be sent, a task on the node's
// own broker is given back (the shared board has no release yet: there the task stays the agent's). Refused: an agent that is not of `project_id` (`mesh.recipient_unknown`), an unknown task (`task.not_found`), a
// blocked one (`task.blocked`), one that is not open (`task.not_open`, also a second dispatch of the same task), a full queue
// (`agent.queue_full`). Not an approval and changes no permission (decision 4); not signed, it needs the sender's access to the agent,
// like `AgentPrompt`. The hub allows each person at most 8 tries per minute (`task.dispatch_limited`).
message TaskDispatch {
  string project_id = 1;
  string task_id = 2;
  string agent_id = 3;
  // The hub user who asked, written by the hub from the window's sign-in (a client's own value is replaced). A node cannot tell a command
  // the hub carried from one sent on its own control socket, so on the node this is the sender's word: the hub's audit row of the command
  // is the record of who asked. Copied into `TaskDispatched`.
  string by_user = 4;
}

// ADR-0095: what the node did with the prompt. `queued` and `queue_len` mean what they mean in `AgentPromptResult`.
message TaskDispatchResult {
  bool queued = 1;
  uint32 queue_len = 2;
  // Lowercase hex SHA-256 of the prompt's UTF-8 bytes, as in `TaskDispatched`.
  string prompt_sha256 = 3;
}

message NodePolicyGet {
  string node_id = 1;
}

// ---- results ----

message ProjectSummary {
  string project_id = 1;
  string name = 2;
}

message ProjectListResult {
  repeated ProjectSummary projects = 1;
}

message AgentStartResult {
  string agent_id = 1;
  string terminal_id = 2;
  string worktree_id = 3;
}

message TerminalOpenResult {
  string terminal_id = 1;
}

message FileEntry {
  string name = 1;
  bool is_dir = 2;
  uint64 size_bytes = 3;
  // ADR-0080: the node treats this file as secret by its name; `files.read` refuses it (`files.secret`).
  bool secret = 4;
}

message FilesListResult {
  repeated FileEntry entries = 1;
}

message FilesReadResult {
  bytes data = 1;
}

message GitStatusResult {
  uint32 files_changed = 1;
  uint32 insertions = 2;
  uint32 deletions = 3;
  string head_commit = 4;
}

message ChatSubscribe {
  string agent_id = 1;
}

enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_AGENT = 1;
  CHAT_ROLE_USER = 2;
}

enum ChatKind {
  CHAT_KIND_UNSPECIFIED = 0;
  CHAT_KIND_TEXT = 1;
  CHAT_KIND_TOOL_CALL = 2;
  CHAT_KIND_PLAN = 3;
  CHAT_KIND_DIFF = 4;
  // ADR-0058: `code` and `params` say what happened; `text` is empty.
  CHAT_KIND_NOTICE = 5;
  // ADR-0090: the agent's thinking, in `text`. Untrusted; a client shows it collapsed and never routes it to another agent.
  CHAT_KIND_THOUGHT = 6;
  // ADR-0090: a marker that points to an approval (`approval_id`) and says its outcome (`permission_outcome`); it holds no decision.
  CHAT_KIND_PERMISSION = 7;
}

// ADR-0090: what a tool does, as ACP names it (`ToolKind`).
enum ToolKind {
  TOOL_KIND_UNSPECIFIED = 0;
  TOOL_KIND_READ = 1;
  TOOL_KIND_EDIT = 2;
  TOOL_KIND_DELETE = 3;
  TOOL_KIND_MOVE = 4;
  TOOL_KIND_SEARCH = 5;
  TOOL_KIND_EXECUTE = 6;
  TOOL_KIND_THINK = 7;
  TOOL_KIND_FETCH = 8;
  TOOL_KIND_SWITCH_MODE = 9;
  TOOL_KIND_OTHER = 10;
}

// ADR-0090: where a tool call is in its life, as ACP names it (`ToolCallStatus`). Also the status of a plan step.
enum ToolStatus {
  TOOL_STATUS_UNSPECIFIED = 0;
  TOOL_STATUS_PENDING = 1;
  TOOL_STATUS_IN_PROGRESS = 2;
  TOOL_STATUS_COMPLETED = 3;
  TOOL_STATUS_FAILED = 4;
}

// ADR-0090: a file a tool call touches (ACP `ToolCallLocation`).
message ToolLocation {
  string path = 1;
  // 1-based; 0 when the agent gave no line.
  uint32 line = 2;
}

enum PlanPriority {
  PLAN_PRIORITY_UNSPECIFIED = 0;
  PLAN_PRIORITY_HIGH = 1;
  PLAN_PRIORITY_MEDIUM = 2;
  PLAN_PRIORITY_LOW = 3;
}

// ADR-0090: one step of a plan (ACP `PlanEntry`). `status` uses PENDING, IN_PROGRESS and COMPLETED; a plan step is never FAILED.
message PlanStep {
  string text = 1;
  ToolStatus status = 2;
  PlanPriority priority = 3;
}

// ADR-0090: how the user's decision on the approval a `CHAT_KIND_PERMISSION` entry points to stands.
enum PermissionOutcome {
  PERMISSION_OUTCOME_UNSPECIFIED = 0;
  PERMISSION_OUTCOME_PENDING = 1;
  PERMISSION_OUTCOME_APPROVED = 2;
  PERMISSION_OUTCOME_DENIED = 3;
  // The turn was cancelled, or the agent went away, before anyone decided.
  PERMISSION_OUTCOME_CANCELLED = 4;
}

// One line of an agent's conversation (ADR-0038). Untrusted text: a model or a person wrote it.
message ChatEntry {
  // Increases per agent; a client ignores one it already has.
  // ADR-0090: a client with the node's capability `chat.rich` REPLACES the entry it has with a later one of the same id (a tool
  // call and a plan change in place); a client without it ignores the repeat and so keeps the first version.
  uint64 entry_id = 1;
  uint64 at_ms = 2;
  ChatRole role = 3;
  ChatKind kind = 4;
  // Text; tool name and arguments as JSON; plan lines joined by "\n"; or the unified diff.
  string text = 5;
  // For a diff: the file.
  string path = 6;
  // ADR-0058, for a notice: a stable code (`adapter.turn_failed`, ...) and its parameters, rendered from the client's locale files.
  string code = 7;
  map<string, string> params = 8;
  // ADR-0090, a tool call (`CHAT_KIND_TOOL_CALL`; `text` stays the tool name and arguments as JSON). One entry for the whole call.
  // The agent's own id of the call; later versions of the entry carry the same one.
  string call_id = 9;
  ToolKind tool_kind = 10;
  ToolStatus status = 11;
  // The files the call touches.
  repeated ToolLocation paths = 12;
  // What the call printed or returned, bounded by the node (16 KiB: head and tail kept). Untrusted text.
  string output = 13;
  // `output` was cut by the node.
  bool output_truncated = 14;
  // Milliseconds since the Unix epoch, node clock: when the node first saw the call, and when it reached completed or failed
  // (0 while it runs). A duration is their difference.
  uint64 started_ms = 15;
  uint64 ended_ms = 16;
  // ADR-0090, a plan (`CHAT_KIND_PLAN`): the steps with their status; `text` stays the step lines joined by "\n" for old clients.
  repeated PlanStep plan_steps = 17;
  // ADR-0090, a user entry: the prompt waits behind the current turn and is not sent yet.
  bool queued = 18;
  // ADR-0090, `CHAT_KIND_PERMISSION`: the approval (`ApprovalRequested.approval_id`) this entry shows and how it stands.
  string approval_id = 19;
  PermissionOutcome permission_outcome = 20;
  // ADR-0101: the approved decision was "always" (the agent remembers it for its session).
  bool permission_always = 21;
}

message ChatSnapshot {
  repeated ChatEntry entries = 1;
}

message GitCommit {
  string id = 1;
  string subject = 2;
  string author = 3;
  uint64 at_ms = 4;
}

message GitLogResult {
  repeated GitCommit commits = 1;
}

message GitDiffResult {
  // Unified diff.
  string diff = 1;
  // ADR-0080: files whose change is named in `diff` (a header, no hunk) and counted here, without content.
  repeated SecretFileChange secret_files = 2;
}

// ADR-0080: a changed secret file: its path (as `diff` names it) and its line counts, which hold no value.
message SecretFileChange {
  string path = 1;
  uint32 added = 2;
  uint32 removed = 3;
}

message WorktreeCreateResult {
  string worktree_id = 1;
  string path = 2;
}

message NodePolicyResult {
  // Commands that require a user-signed approval on this node.
  repeated string approval_required = 1;
  repeated string allowed_agent_kinds = 2;
}

// ---- ADR-0025: agent.list ----

// An empty node_id means this node.
message AgentList {
  string node_id = 1;
}

message AgentSummary {
  string agent_id = 1;
  string kind = 2;
  AgentState state = 3;
  string worktree_id = 4;
  // Empty for an agent with no terminal (an L3 adapter agent).
  string terminal_id = 5;
  bool running = 6;
  uint32 restarts = 7;
}

message AgentListResult {
  repeated AgentSummary agents = 1;
  // ADR-0107: the agents the node found interrupted (ADR-0060) and still offers, oldest id first, each the `AgentInterrupted` the
  // node announces for it. An agent the supervisor holds is in `agents` only. Old nodes send none.
  repeated AgentInterrupted interrupted = 2;
}

// ADR-0030: which agents this node can start.
message AgentKinds {}

message AgentKind {
  // What AgentStart.kind takes.
  string kind = 1;
  string display_name = 2;
  IntegrationLevel level = 3;
  // Whether the launch program is found on this node.
  bool installed = 4;
  // ADR-0059: the options a start may choose (the manifest's `[[launch.option]]`s, in its order). Old nodes send none.
  repeated LaunchOption launch_options = 5;
  // ADR-0069: the program the node looks for on its PATH (a bare file name such as `wstack`, never a path), so a kind that is not
  // installed can say what is missing. Empty from an old node (capability `kinds.program`).
  string program = 6;
  // ADR-0066: the settings a start may give (the manifest's `[[launch.setting]]`s, in its order). Old nodes send none.
  repeated LaunchSettingSpec settings = 7;
  // ADR-0123: who serves the kind's models (the manifest's `[agent] provider`, `[a-z0-9-]`, at most 32), empty when the manifest
  // does not say (a kind that can use many providers). Old nodes send none.
  string provider = 8;
}

// ADR-0066: one `[[launch.setting]]` of a kind, as clients show it. The arguments it adds stay on the node.
message LaunchSettingSpec {
  string id = 1;
  // A Fluent message id; a client without it shows `id`.
  string label = 2;
  // The values a start may choose, in order; empty means any plain value (a model name the tool itself checks).
  repeated string values = 3;
  // What the tool uses when nothing is chosen, for display only; empty when the manifest does not say.
  string default_value = 4;
}

// ADR-0059: one `[[launch.option]]` of a kind. The arguments it adds stay on the node.
message LaunchOption {
  string id = 1;
  // A Fluent message id; a client without it shows `id`.
  string label = 2;
  // The agent acts without asking (a permission-skipping flag): never preselected, confirmed, signed, audited, badged.
  bool skips_permissions = 3;
}

message AgentKindsResult {
  repeated AgentKind kinds = 1;
}

// ADR-0033. Answered by the hub itself from its view and price table; never routed to a node.
message UsageReport {}

message AgentUsage {
  // The hub-wide key <node>/<agent>.
  string agent_id = 1;
  // As the agent reported it; empty when it never did.
  string model = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  // Estimated cost in micro-USD (1 USD = 1_000_000). Absent when no price is known: never a guess.
  optional uint64 micro_usd = 5;
}

message UsageReportResult {
  repeated AgentUsage agents = 1;
  // Sum of the estimates above; agents without a price add nothing.
  uint64 total_micro_usd = 2;
  // When the price table was refreshed, ms since the epoch; 0 for the table bundled with the release.
  uint64 prices_at_ms = 3;
}

// ADR-0052: signed only on the routed path; owner-only local control needs no signature.
// Domain-separated canonical bytes are specified in docs/specs/protocol.md.
message DirectoryAuthorization {
  string device_id = 1;
  string nonce = 2;
  uint64 expires_at_ms = 3;
  bytes signature = 4;
}
message DirectoryInspect {
  string path = 1;
  // Explicit user action: create metadata only if absent, never overwrite it or commit it.
  bool create_project_id = 2;
  DirectoryAuthorization authorization = 3;
}
message DirectoryInfo {
  string path = 1;
  string project_id = 2;
  string git_root = 3;
  string branch = 4;
  bool portable = 5;
  string previous_project_id = 6;
}
// ADR-0053. Lists the sub-folders of one folder on a node: names only, never files. `path` empty means the user's home folder.
message DirectoryList {
  string path = 1;
  DirectoryAuthorization authorization = 2;
}
message DirectoryEntry {
  string name = 1;
  bool is_git = 2;
}
message DirectoryEntries {
  // The canonical folder the node resolved, and its parent (empty at a root).
  string path = 1;
  string parent = 2;
  repeated DirectoryEntry entries = 3;
  // More folders exist than the node answers with (at most 500 per answer).
  bool truncated = 4;
}
// ADR-0073. The hub stops listing an offline machine. `refuse_return` also revokes every certificate enrolled under `node_id`, so a
// later connection is refused (`auth.device_revoked`) until the machine enrolls again.
message NodeForget {
  string node_id = 1;
  bool refuse_return = 2;
}

// ADR-0053. The hub stops listing a closed agent. Answered by the hub; refused with `agent.running` while the agent runs.
// ADR-0108: the hub then sends it, with the node's own id of the agent, to a node that offers `agent.forget.local`.
message AgentForget {
  string agent_id = 1;
}

// ADR-0060. Brings back an agent the node reported interrupted (`AgentInterrupted`): same agent id, same folder, same project. The
// node runs the manifest's `[resume]` argv or the adapter's session load with the agent's own session id; with `new_session` it starts
// a new session of the same kind in the same folder instead ("Start again"). Signed like `agent.launch` on the routed path (operation
// `resume`, see docs/specs/protocol.md); the node answers with `AgentLaunchResult`.
message AgentResume {
  // The node's own id of the agent (`agent-7`), not the hub-wide key.
  string agent_id = 1;
  bool new_session = 2;
  DirectoryAuthorization authorization = 3;
}

message AgentLaunch {
  string path = 1;
  string project_id = 2;
  string kind = 3;
  bool separate_worktree = 4;
  DirectoryAuthorization authorization = 5;
  bool accept_identity_change = 6;
  // ADR-0059: ids of the kind's `[[launch.option]]`s to start with (capability `agent.launch_options`). When not empty the
  // authorization signs them too (`directory-action-v3`, docs/specs/protocol.md), so a hub can neither add nor remove one.
  repeated string launch_options = 7;
  // ADR-0059: as `AgentStart.confirmed_launch_options`; signed with `launch_options` as a separate list.
  repeated string confirmed_launch_options = 8;
  // ADR-0066: values for the kind's `[[launch.setting]]`s (capability `agent.launch_settings`). When not empty the authorization signs
  // them too (`directory-action-v4`, docs/specs/protocol.md), in the order sent, so a hub can neither add, change, drop nor reorder one.
  repeated LaunchSetting settings = 9;
}
message AgentLaunchResult {
  string agent_id = 1;
  string terminal_id = 2;
  string workspace_id = 3;
  string path = 4;
}

// Read-only operations over registered workspaces. Results use the existing data-only result messages.
message WorkspaceQuery {
  string workspace_id = 1;
  // list, read, status, diff, history
  string operation = 2;
  string path = 3;
  uint32 limit = 4;
}

// ADR-0082: proves the caller can read the node's `control.token` file (the owner's own processes can, a confined agent cannot).
// `token` is 64 lowercase hex characters (32 random bytes). A node that does not require the token answers ok to any value;
// a node that does answers `auth.unauthenticated` to a wrong one and closes the connection. Never logged, never in an event.
message ControlAuth {
  string token = 1;
}

// ADR-0109: a cross-node handoff of a named task to one specific run. Summary and refs are untrusted mesh data.
message DeliverTaskHandoff {
  // Opaque 16-byte identities; the hub keeps both unchanged on a retry.
  bytes delivery_id = 1;
  bytes receiver_run_id = 2;
  string agent_id = 3;
  string project_id = 4;
  string task_id = 5;
  string summary = 6;
  repeated string refs = 7;
  // Deadline for creating a new entry, in Unix milliseconds; unchanged on a retry.
  uint64 valid_until_ms = 8;
  string sender_node = 9;
  string sender_agent_id = 10;
}

// Echoes the two identities of the single durable inbox entry, including when it has already been read.
message TaskHandoffReceipt {
  bytes delivery_id = 1;
  bytes receiver_run_id = 2;
}

// ADR-0113 decision 6: the community theme catalog. The hub fetches it only on its owner's command (`agora hub themes update`), checks
// every theme with the theme rules of `docs/ux/themes.md`, and keeps the accepted ones; a window never fetches from another origin. The
// catalog is off until the owner turns it on (`agora hub themes on`).
message ThemeCatalogList {}

// One theme of the catalog, as its index names it. All of it is text from the catalog's index: shown as text, never as markup.
message ThemeCatalogEntry {
  // Lowercase letters, digits and `-`, at most 40; unique in the catalog.
  string id = 1;
  string name = 2;
  // A whole number from 1 that only grows: a higher number is a newer version of the same theme.
  uint32 version = 3;
  string author = 4;
  // An SPDX licence identifier, as the index gives it.
  string licence = 5;
  // The SHA-256 of the theme file as fetched, 64 lowercase hex characters.
  string sha256 = 6;
  // The theme file's size in bytes.
  uint32 size = 7;
  // ADR-0120: the day the catalog first listed it, `YYYY-MM-DD`; empty when its index gives none (format 1).
  string added = 8;
  // ADR-0120: the popularity the catalog publishes for it (0 to 1 000 000 000; 0 when its index gives none). Never counted by Agora.
  uint64 popularity = 9;
}

// `on` is false while the owner has not turned the catalog on; `entries` is then empty. `updated_at_ms` is when the hub last fetched
// the catalog (0: never).
message ThemeCatalogListResult {
  bool on = 1;
  repeated ThemeCatalogEntry entries = 2;
  uint64 updated_at_ms = 3;
}

// One theme's file, by its id. Refused with `theme.catalog_off` while the catalog is off and `theme.not_found` for an id it lacks.
message ThemeCatalogGet {
  string id = 1;
}

// The theme file exactly as the hub fetched and checked it (JSON text, format 1 or 2). A window checks it again before showing it.
message ThemeCatalogTheme {
  ThemeCatalogEntry entry = 1;
  string data = 2;
}

message AcknowledgeTaskHandoff {
  string delivery_id = 1;
}

message TaskReviewRead {
  string project_id = 1;
  string task_id = 2;
  uint64 report_revision = 3;
}

enum TaskReviewDecision {
  TASK_REVIEW_DECISION_UNSPECIFIED = 0;
  TASK_REVIEW_DECISION_ACCEPT = 1;
  TASK_REVIEW_DECISION_RETURN = 2;
}

message TaskReviewDecide {
  string project_id = 1;
  string task_id = 2;
  uint64 report_revision = 3;
  TaskReviewDecision decision = 4;
}

message TaskReviewReport {
  string summary = 1;
  repeated string refs = 2;
}


// ADR-0128, board.task_acceptance_notice.v1: hub to node, no report text is carried.
message DeliverTaskAcceptanceNotice {
  bytes delivery_id = 1;
  string agent_id = 2;
  bytes receiver_run_id = 3;
  string project_id = 4;
  string task_id = 5;
  uint64 report_revision = 6;
  uint64 accepted_at_ms = 7;
  uint64 valid_until_ms = 8;
}

message TaskAcceptanceNoticeReceipt {
  bytes delivery_id = 1;
  bytes receiver_run_id = 2;
}

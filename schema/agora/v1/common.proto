syntax = "proto3";

package agora.v1;

// Shared types used by events and commands.

enum AgentState {
  // Unknown or not set; receivers must treat any unrecognised value like this one.
  AGENT_STATE_UNSPECIFIED = 0;
  AGENT_STATE_WORKING = 1;
  AGENT_STATE_BLOCKED = 2;
  AGENT_STATE_IDLE = 3;
  AGENT_STATE_DONE = 4;
}

enum IntegrationLevel {
  INTEGRATION_LEVEL_UNSPECIFIED = 0;
  INTEGRATION_LEVEL_L0_GENERIC = 1;
  INTEGRATION_LEVEL_L1_MANIFEST = 2;
  INTEGRATION_LEVEL_L2_ACP = 3;
  INTEGRATION_LEVEL_L3_ADAPTER = 4;
}

// ADR-0101: how far a person's answer to an approval reaches. A value this build does not know is refused, never read as either.
enum ApprovalScope {
  // Read as ONCE everywhere: what every decision meant before ADR-0101.
  APPROVAL_SCOPE_UNSPECIFIED = 0;
  APPROVAL_SCOPE_ONCE = 1;
  // The agent remembers the answer, as the agent defines it (ACP `allow_always`), for the rest of its session.
  APPROVAL_SCOPE_ALWAYS = 2;
}

enum TerminalPurpose {
  TERMINAL_PURPOSE_UNSPECIFIED = 0;
  TERMINAL_PURPOSE_AGENT = 1;
  TERMINAL_PURPOSE_SHELL = 2;
  TERMINAL_PURPOSE_SERVICE = 3;
}

// ADR-0058: one mode or model an agent offers for its session, as its adapter reports it. `id` is what `AgentSetMode.mode` and
// `AgentSetModel.model` take; `name` and `description` are the agent's own words (untrusted text, shown as written).
message SessionOption {
  string id = 1;
  string name = 2;
  string description = 3;
  // A mode in which the agent acts without asking first (it skips its own permission prompts). A client asks the user to confirm
  // before choosing it and never chooses it by default. Always false for a model.
  bool skips_permissions = 4;
}

// ADR-0090: how a config option is chosen, as ACP names it (`SessionConfigOption` type).
enum SessionConfigType {
  SESSION_CONFIG_TYPE_UNSPECIFIED = 0;
  SESSION_CONFIG_TYPE_SELECT = 1;
  SESSION_CONFIG_TYPE_BOOLEAN = 2;
}

// ADR-0090: what a config option is about (ACP `category`). The reasoning effort is THOUGHT_LEVEL. UNSPECIFIED also stands for a
// category this build does not know.
enum SessionConfigCategory {
  SESSION_CONFIG_CATEGORY_UNSPECIFIED = 0;
  SESSION_CONFIG_CATEGORY_MODE = 1;
  SESSION_CONFIG_CATEGORY_MODEL = 2;
  SESSION_CONFIG_CATEGORY_MODEL_CONFIG = 3;
  SESSION_CONFIG_CATEGORY_THOUGHT_LEVEL = 4;
  // An option the agent defines itself (ACP `_custom`).
  SESSION_CONFIG_CATEGORY_CUSTOM = 5;
}

// ADR-0090: one option of the agent's session that the user may change (ACP `SessionConfigOption`). `name`, `description` and the
// choices' words are the agent's own (untrusted text, shown as written).
message SessionConfigOption {
  // What `AgentSetConfig.config_id` takes.
  string id = 1;
  string name = 2;
  string description = 3;
  SessionConfigCategory category = 4;
  SessionConfigType type = 5;
  // The id of the chosen choice for a select; "true" or "false" for a boolean.
  string current = 6;
  // The choices of a select (empty for a boolean); `SessionOption.id` is what `AgentSetConfig.value` takes.
  repeated SessionOption choices = 7;
  // An option that makes the agent act without asking first (as `SessionOption.skips_permissions`); the node sets it by its own
  // rules, not from the agent's category. A client asks the user to confirm before choosing it.
  bool skips_permissions = 8;
}

// ADR-0066: one value chosen for a kind's `[[launch.setting]]`. The node checks it against its manifest (`agent.setting_unknown`,
// `agent.setting_invalid`) and puts it into its argument template as one argument, never through a shell.
// (Defined here, not in commands.proto, so events can carry it too: ADR-0123. Same package, same wire.)
message LaunchSetting {
  string id = 1;
  string value = 2;
}

// A flat error parameter: a string or a number (docs/specs/error-codes.md).
message ParamValue {
  oneof value {
    string str = 1;
    int64 int = 2;
  }
}

// An error as carried on the wire. `code` is a stable dotted code; never human text.
message ErrorInfo {
  string code = 1;
  map<string, ParamValue> params = 2;
}

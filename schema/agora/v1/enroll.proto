syntax = "proto3";

package agora.v1;

import "agora/v1/devices.proto";

// ADR-0027: enrollment of a node that has no certificate yet. The hub chooses the identity: node_id is a request.

message EnrollRequest {
  // One-time code the user created in the window.
  string code = 1;
  string node_id = 2;
  string csr_pem = 3;
}

message EnrollResponse {
  string cert_pem = 1;
  // The hub CA to pin.
  string ca_pem = 2;
  uint64 not_after_ms = 3;
  // ADR-0061: the registered devices (candidates only), so the owner at the machine can say which ones it trusts. Old hubs send none.
  repeated DeviceInfo devices = 4;
}

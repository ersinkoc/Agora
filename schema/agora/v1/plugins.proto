syntax = "proto3";

package agora.v1;

// ADR-0114 decision 6 (build step 3): community plugins kept by the hub, and what each person allowed them to see.
//
// The hub's owner installs a plugin on the hub's own machine (`agora hub plugin add FILE`); no message installs or removes one. The
// hub checks the package as the window does (docs/ux/plugins.md, "The package"), keeps it as opaque bytes and never runs it. A window
// lists the installed plugins, fetches each package in pieces (a package is up to 2 MiB, a frame at most 1 MiB), checks it again
// itself and runs it only in a sandboxed frame. Grants are kept per person: each person, owner, member or viewer, sets and reads only
// their own. Every message here is answered by the hub itself and names no node (`CommandRequest.target_node` empty).

// client -> hub, answered with `PluginListResult`: the plugins installed on this hub.
message PluginList {}

// One installed plugin, from the manifest the hub checked. The window takes nothing here on trust: it runs a plugin only from the
// package it fetched and checked itself.
message PluginInfo {
  // The manifest's `id`.
  string plugin_id = 1;
  // The manifest's `version` (`x.y.z`).
  string version = 2;
  // The manifest's `name`: the plugin's own text, shown as text, never as the window's words.
  string name = 3;
  // The SHA-256 of the whole package, lowercase hex; `PluginFetch` names it.
  string sha256 = 4;
  // The package's size in bytes (at most 2 MiB).
  uint64 size = 5;
  // The manifest's `capabilities`, in its order.
  repeated string capabilities = 6;
  // Milliseconds since the Unix epoch, hub clock.
  uint64 installed_ms = 7;
}

message PluginListResult {
  // Ordered by `plugin_id`.
  repeated PluginInfo plugins = 1;
}

// client -> hub, answered with `PluginFetchResult`: a piece of an installed package, from `offset`. Refused with `plugin.not_found`
// when no plugin `plugin_id` is installed with that package (it was removed, or replaced by another version).
message PluginFetch {
  string plugin_id = 1;
  // `PluginInfo.sha256` of the package wanted.
  string sha256 = 2;
  // Where the piece starts, in bytes; at most the package's size.
  uint64 offset = 3;
}

message PluginFetchResult {
  string plugin_id = 1;
  string sha256 = 2;
  // The whole package's size in bytes.
  uint64 total_size = 3;
  // Where `data` starts in the package.
  uint64 offset = 4;
  // The bytes from `offset`, at most 512 KiB; empty at the end.
  bytes data = 5;
}

// What one person allowed one plugin to see (docs/ux/plugins.md, "Grants").
message PluginGrant {
  string plugin_id = 1;
  // The version the grant was given for.
  string version = 2;
  // The capabilities that version asked for, all shown to the person. A later version that asks for one not here is held until the
  // person looks again.
  repeated string seen = 3;
  // The capabilities the person allowed, each one of `seen`.
  repeated string granted = 4;
  // Milliseconds since the Unix epoch, hub clock.
  uint64 set_ms = 5;
}

// client -> hub, answered with `PluginGrantListResult`: the caller's own grants, one per plugin, each for the version it was given
// for (which may be older than the one installed now).
message PluginGrantList {}

message PluginGrantListResult {
  // Ordered by `plugin_id`.
  repeated PluginGrant grants = 1;
}

// client -> hub, answered with `Empty`: the caller allows `granted` of what the installed `version` of `plugin_id` asks for, and has
// seen all of it. Replaces the caller's grant for that plugin. Refused with `plugin.not_found` unless that version, with the package
// `sha256`, is installed now (the person was shown exactly that package), and with `protocol.invalid_message` (`granted`) for a
// capability it does not ask for. The hub records `seen` from the installed manifest itself.
message PluginGrantSet {
  string plugin_id = 1;
  string version = 2;
  repeated string granted = 3;
  // `PluginInfo.sha256` of the package the person was shown.
  string sha256 = 4;
}

// client -> hub, answered with `Empty`: the caller stops showing `plugin_id` and forgets their grant for it (the plugin stays installed
// for everyone else). Forgetting a grant that does not exist is not an error.
message PluginGrantRemove {
  string plugin_id = 1;
}

syntax = "proto3";

package agora.v1;

import "agora/v1/common.proto";

// Events are immutable facts (docs/specs/protocol.md section 3). Each producer numbers its events;
// the receiver applies a (producer_id, seq) at most once.
message Event {
  string producer_id = 1;
  uint64 seq = 2;
  // Milliseconds since the Unix epoch, producer clock.
  uint64 at_ms = 3;

  oneof body {
    // node
    NodeOnline node_online = 10;
    NodeOffline node_offline = 11;
    NodeResources node_resources = 12;
    // ADR-0070: the hub's own record that a node's connection opened or ended. Only the hub writes it (producer `hub`).
    NodeLink node_link = 14;
    // project
    CheckoutDiscovered checkout_discovered = 20;
    WorktreeCreated worktree_created = 21;
    WorktreeRemoved worktree_removed = 22;
    GitStatusChanged git_status_changed = 23;
    WorkspaceRegistered workspace_registered = 24;
    WorkspaceStatusChanged workspace_status_changed = 25;
    AgentWorkspaceBound agent_workspace_bound = 35;
    // agent
    AgentStarted agent_started = 30;
    AgentStateChanged agent_state_changed = 31;
    AgentSessionReported agent_session_reported = 32;
    AgentUsageReported agent_usage_reported = 33;
    AgentExited agent_exited = 34;
    // ADR-0053: the hub stops listing this closed agent; earlier events stay in the store.
    AgentForgotten agent_forgotten = 36;
    // ADR-0058: the modes and models an agent offers, and the ones in use.
    AgentSessionOptions agent_session_options = 37;
    // ADR-0060: an agent that was running when the node stopped, found in the node's session ledger after it started again.
    AgentInterrupted agent_interrupted = 38;
    // terminal
    TerminalOpened terminal_opened = 40;
    TerminalTitleChanged terminal_title_changed = 41;
    TerminalClosed terminal_closed = 42;
    // approval
    ApprovalRequested approval_requested = 50;
    ApprovalResolved approval_resolved = 51;
    // mesh
    MessagePosted message_posted = 60;
    TaskChanged task_changed = 61;
    LeaseGranted lease_granted = 62;
    LeaseReleased lease_released = 63;
    HandoffCreated handoff_created = 64;
    // ADR-0057: the node refused an agent's `agent_start` before any approval was asked (limits, folder, kind).
    AgentStartRefused agent_start_refused = 65;
    // files
    FilesChanged files_changed = 70;
  }
}

message NodeOnline {
  string node_id = 1;
  string hostname = 2;
  string os = 3;
  string build = 4;
}

message NodeOffline {
  string node_id = 1;
}

// ADR-0070: presence is a fact the hub owns. The hub writes it from the certificate-authenticated connection only: `up` when a
// node's connection is open after the handshake (a first connect or a reconnect; never a process start, so nothing the node runs
// is reset), `up = false` when that connection ends or is closed as silent. Clients take a machine's `online` from its latest
// presence fact by log position: this event, or `NodeOnline` / `NodeOffline` for data an older hub wrote.
message NodeLink {
  string node_id = 1;
  bool up = 2;
  NodeLinkReason reason = 3;
  // Counts the node's connections as the hub saw them (1, 2, ...; kept across hub restarts). A fact about an older connection
  // than the node's latest `up` changes nothing.
  uint64 generation = 4;
  // Milliseconds since the Unix epoch, hub clock: when the hub last received anything from the node on this connection (for
  // `up`, when it opened). What the window shows as "last seen".
  uint64 last_heard_ms = 5;
}

enum NodeLinkReason {
  NODE_LINK_REASON_UNSPECIFIED = 0;
  // The connection is open after the handshake (`up`).
  NODE_LINK_REASON_OPENED = 1;
  // The connection ended (the node closed it, or the network did).
  NODE_LINK_REASON_CLOSED = 2;
  // Nothing arrived from the node within the hub's silence deadline; the hub closed the connection.
  NODE_LINK_REASON_SILENT = 3;
  // A newer connection of the same node took its place. Never makes the node offline: the newer one is up.
  NODE_LINK_REASON_REPLACED = 4;
}

message NodeResources {
  string node_id = 1;
  uint32 agents_running = 2;
  uint32 terminals_open = 3;
  uint64 memory_used_bytes = 4;
}

message CheckoutDiscovered {
  string checkout_id = 1;
  string node_id = 2;
  // Machine-independent project identity (normalized remote + root commit).
  string project_id = 3;
  string path = 4;
}

message WorktreeCreated {
  string worktree_id = 1;
  string checkout_id = 2;
  string path = 3;
  string branch = 4;
}

message WorktreeRemoved {
  string worktree_id = 1;
}

message GitStatusChanged {
  string worktree_id = 1;
  uint32 files_changed = 2;
  uint32 insertions = 3;
  uint32 deletions = 4;
  string head_commit = 5;
}

message AgentStarted {
  string agent_id = 1;
  string project_id = 2;
  string node_id = 3;
  string worktree_id = 4;
  string kind = 5;
  IntegrationLevel level = 6;
  // ADR-0057: the agent that started this one through the mesh (`agent_start`), on the same node; empty when the user started it.
  // Old clients ignore it.
  string parent_agent_id = 7;
  // ADR-0059: the launch options the agent was started with, and whether one of them skips permissions (the "does not ask"
  // badge for the agent's whole life). Old clients ignore them. (30-39 are kept for ADR-0059.)
  repeated string launch_options = 30;
  bool skips_permissions = 31;
}

message AgentStateChanged {
  string agent_id = 1;
  AgentState state = 2;
  // True when the agent or an adapter reported it; false when derived from the screen.
  bool reported = 3;
}

message AgentSessionReported {
  string agent_id = 1;
  string session_id = 2;
}

message AgentUsageReported {
  string agent_id = 1;
  string model = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  // ADR-0058: what the agent's own reported cost grew by, in micro-units of `currency`; absent when it reported none.
  optional uint64 cost_micros = 5;
  string currency = 6;
  // ADR-0058: the tokens the agent's context holds now and how many it can hold (a level, not a growth); 0 when not reported.
  uint64 context_tokens = 7;
  uint64 context_window = 8;
}

// ADR-0058: replaces the previous report for this agent.
message AgentSessionOptions {
  string agent_id = 1;
  repeated SessionOption modes = 2;
  repeated SessionOption models = 3;
  string current_mode = 4;
  string current_model = 5;
}

message AgentExited {
  string agent_id = 1;
  int32 exit_code = 2;
}

// ADR-0060. Said once for each such agent after the node starts (and again in a resync announcement) until it is resumed, started
// again, or offered for longer than the node keeps it (14 days). The hub keeps it with the closed agents; an `AgentStarted` with the
// same id ends it.
message AgentInterrupted {
  string agent_id = 1;
  string kind = 2;
  string project_id = 3;
  // The folder it worked in (its workspace path, or its own worktree).
  string folder = 4;
  // ADR-0057: the agent that started it, on this node; empty when the user did.
  string parent_agent_id = 5;
  // The node has the agent's own session id and its kind can resume one: Resume continues the conversation. False: only a new
  // session in the same folder can be offered (Start again).
  bool resumable = 6;
  // Node clock, milliseconds since the Unix epoch.
  uint64 started_at_ms = 7;
  uint64 interrupted_at_ms = 8;
  // The last state the node saw.
  AgentState last_state = 9;
  // Its process outlived the node (a node killed without stopping its agents) and still runs: Resume is refused until it is
  // stopped (`agent.stop` ends exactly that process), so two processes never continue one conversation.
  bool still_running = 10;
}

message AgentForgotten {
  string agent_id = 1;
}

message TerminalOpened {
  string terminal_id = 1;
  string node_id = 2;
  TerminalPurpose purpose = 3;
  string agent_id = 4;
}

message TerminalTitleChanged {
  string terminal_id = 1;
  string title = 2;
}

message TerminalClosed {
  string terminal_id = 1;
}

message ApprovalRequested {
  string approval_id = 1;
  string agent_id = 2;
  // What the agent wants to do, for example "run_command" or "write_file".
  string action = 3;
  string detail = 4;
  uint64 expires_at_ms = 5;
}

message ApprovalResolved {
  string approval_id = 1;
  bool approved = 2;
  // Device that signed the decision (ADR-0020).
  string signer_device_id = 3;
  // ADR-0057: for an approved `agent.start`, how many helpers of that kind in that folder the signed decision allows the asking
  // agent for its session (this start included). 0: this start only.
  uint32 helper_grant = 4;
  // ADR-0057: `ApprovalResolve.helpers_may_start` as signed.
  bool helpers_may_start = 5;
}

message MessagePosted {
  string message_id = 1;
  string from_agent_id = 2;
  // An agent id or a channel name.
  string to = 3;
  string body = 4;
}

message TaskChanged {
  string task_id = 1;
  string project_id = 2;
  string title = 3;
  string claimed_by_agent_id = 4;
  bool done = 5;
}

message LeaseGranted {
  string agent_id = 1;
  string path = 2;
  uint64 expires_at_ms = 3;
}

message LeaseReleased {
  string agent_id = 1;
  string path = 2;
}

message HandoffCreated {
  string task_id = 1;
  string from_agent_id = 2;
  string to_agent_id = 3;
  string summary = 4;
  repeated string refs = 5;
}

// ADR-0057. `code` is the error code the asking agent received (`mesh.helper_limit`, `mesh.folder_not_allowed`,
// `mesh.rate_limited`, `node.policy_denied`, ...); `kind` and `folder` are what it asked for. The prompt is not repeated here.
message AgentStartRefused {
  string agent_id = 1;
  string kind = 2;
  string folder = 3;
  string code = 4;
}

message FilesChanged {
  string worktree_id = 1;
  // Batched, relative to the worktree root.
  repeated string paths = 2;
}

// ADR-0026: hub -> producer on the events stream. Cumulative: every event of that producer with seq <= up_to_seq is
// durably stored and may be dropped.
message EventAck {
  uint64 up_to_seq = 1;
}

// A directory used by one or more agents. User-owned directories are never Git worktrees by implication.
message WorkspaceRegistered {
  string workspace_id = 1;
  string node_id = 2;
  string project_id = 3;
  string path = 4;
  string git_root = 5;
  string branch = 6;
  bool managed_worktree = 7;
  uint32 files_changed = 8;
}
message AgentWorkspaceBound {
  string agent_id = 1;
  string workspace_id = 2;
}

message WorkspaceStatusChanged {
  string workspace_id = 1;
  uint32 files_changed = 2;
  uint32 insertions = 3;
  uint32 deletions = 4;
  string head_commit = 5;
}

syntax = "proto3";

package agora.v1;

import "agora/v1/common.proto";
import "agora/v1/preview.proto";
import "agora/v1/share.proto";

// Events are immutable facts (docs/specs/protocol.md section 3). Each producer numbers its events;
// the receiver applies a (producer_id, seq) at most once.
message Event {
  string producer_id = 1;
  uint64 seq = 2;
  // Milliseconds since the Unix epoch, producer clock.
  uint64 at_ms = 3;

  oneof body {
    // node
    NodeOnline node_online = 10;
    NodeOffline node_offline = 11;
    NodeResources node_resources = 12;
    // ADR-0070: the hub's own record that a node's connection opened or ended. Only the hub writes it (producer `hub`).
    NodeLink node_link = 14;
    // ADR-0061: the devices this node trusts now.
    NodeTrustedDevices node_trusted_devices = 13;
    // ADR-0073: the owner had the hub forget this offline machine. Only the hub writes it (producer `hub`); earlier events stay.
    NodeForgotten node_forgotten = 15;
    // project
    CheckoutDiscovered checkout_discovered = 20;
    WorktreeCreated worktree_created = 21;
    WorktreeRemoved worktree_removed = 22;
    GitStatusChanged git_status_changed = 23;
    WorkspaceRegistered workspace_registered = 24;
    WorkspaceStatusChanged workspace_status_changed = 25;
    AgentWorkspaceBound agent_workspace_bound = 35;
    // agent
    AgentStarted agent_started = 30;
    AgentStateChanged agent_state_changed = 31;
    AgentSessionReported agent_session_reported = 32;
    AgentUsageReported agent_usage_reported = 33;
    AgentExited agent_exited = 34;
    // ADR-0053: the hub stops listing this closed agent; earlier events stay in the store.
    AgentForgotten agent_forgotten = 36;
    // ADR-0058: the modes and models an agent offers, and the ones in use.
    AgentSessionOptions agent_session_options = 37;
    // ADR-0060: an agent that was running when the node stopped, found in the node's session ledger after it started again.
    AgentInterrupted agent_interrupted = 38;
    // ADR-0090: the options of the session the user may change (effort among them); replaces the previous report.
    AgentSessionConfig agent_session_config = 39;
    // ADR-0090: the slash commands the agent offers; replaces the previous list.
    AgentCommands agent_commands = 66;
    // ADR-0091, capability `usage.quota`: how much of a plan window a subscription tool reports it has used, as the tool's own output
    // says it. A fact about a tool on a machine, not about one agent.
    AgentQuotaObserved agent_quota_observed = 67;
    // ADR-0101, capability `approval.always`: an agent holds an "always" answer for its session.
    AgentAlwaysAllowed agent_always_allowed = 69;
    // ADR-0094: the kind of the program a person runs by hand in a plain terminal (a `shell` agent), found by the node's process lookup;
    // `kind` empty when that program ended.
    AgentRunsInside agent_runs_inside = 90;
    // terminal
    TerminalOpened terminal_opened = 40;
    TerminalTitleChanged terminal_title_changed = 41;
    TerminalClosed terminal_closed = 42;
    // approval
    ApprovalRequested approval_requested = 50;
    ApprovalResolved approval_resolved = 51;
    // mesh
    MessagePosted message_posted = 60;
    TaskChanged task_changed = 61;
    LeaseGranted lease_granted = 62;
    LeaseReleased lease_released = 63;
    HandoffCreated handoff_created = 64;
    // ADR-0121: only the hub writes delivery outcomes for the shared board.
    TaskHandoffDeliveryChanged task_handoff_delivery_changed = 91;
    // ADR-0122: the hub says a shared item changed; a node says it will not give one to its agents.
    ShareItemChanged share_item_changed = 92;
    ShareItemRefused share_item_refused = 93;
    // ADR-0125: the hub owns shared-board review.
    TaskReviewChanged task_review_changed = 94;
    TaskReviewEnabled task_review_enabled = 95;
    TaskParentLinked task_parent_linked = 96; // ADR-0126, hub only.
    // ADR-0095, capability `task.dispatch`: a person gave a task to an agent (the audit record of `TaskDispatch`).
    TaskDispatched task_dispatched = 68;
    // ADR-0057: the node refused an agent's `agent_start` before any approval was asked (limits, folder, kind).
    AgentStartRefused agent_start_refused = 65;
    // files
    FilesChanged files_changed = 70;
    // ADR-0088, capability `preview.v1` (not offered yet): an agent's suggestion (never an open), and a forward that opened or ended.
    PreviewSuggested preview_suggested = 80;
    PreviewChanged preview_changed = 81;
  }
}

message NodeOnline {
  string node_id = 1;
  string hostname = 2;
  string os = 3;
  string build = 4;
  // ADR-0069: the node's own executable (its full path) only when the folder it is in is not on the node's PATH, so a client can
  // say to run `agora` from that folder; empty otherwise, and from an old node. Only the hub's owner receives it whole; the hub sends
  // everyone else its file name alone (`agora.exe`), since a folder may hold the machine's user name.
  string binary = 5;
  // ADR-0124: live runs the node is about to reannounce. For the hub only, at most 1,024 entries.
  repeated RetainedAgentRun retained_agent_runs = 6;
}

message RetainedAgentRun {
  string agent_id = 1; // Node-local id, at most 256 bytes.
  bytes run_id = 2; // The same opaque 16-byte run id as AgentStarted.
}

message NodeOffline {
  string node_id = 1;
}

// ADR-0070: presence is a fact the hub owns. The hub writes it from the certificate-authenticated connection only: `up` when a
// node's connection is open after the handshake (a first connect or a reconnect; never a process start, so nothing the node runs
// is reset), `up = false` when that connection ends or is closed as silent. Clients take a machine's `online` from its latest
// presence fact by log position: this event, or `NodeOnline` / `NodeOffline` for data an older hub wrote.
message NodeLink {
  string node_id = 1;
  bool up = 2;
  NodeLinkReason reason = 3;
  // Counts the node's connections as the hub saw them (1, 2, ...; kept across hub restarts). A fact about an older connection
  // than the node's latest `up` changes nothing.
  uint64 generation = 4;
  // Milliseconds since the Unix epoch, hub clock: when the hub last received anything from the node on this connection (for
  // `up`, when it opened). What the window shows as "last seen".
  uint64 last_heard_ms = 5;
}

enum NodeLinkReason {
  NODE_LINK_REASON_UNSPECIFIED = 0;
  // The connection is open after the handshake (`up`).
  NODE_LINK_REASON_OPENED = 1;
  // The connection ended (the node closed it, or the network did).
  NODE_LINK_REASON_CLOSED = 2;
  // Nothing arrived from the node within the hub's silence deadline; the hub closed the connection.
  NODE_LINK_REASON_SILENT = 3;
  // A newer connection of the same node took its place. Never makes the node offline: the newer one is up.
  NODE_LINK_REASON_REPLACED = 4;
}

message NodeResources {
  string node_id = 1;
  uint32 agents_running = 2;
  uint32 terminals_open = 3;
  // The node process's own memory.
  uint64 memory_used_bytes = 4;
  // ADR-0136: the machine's own figures. Zero (or no disks) means "not reported", never "zero".
  // Logical CPUs.
  uint32 cpu_count = 5;
  // The share of all CPUs' time the machine was busy since the previous reading, 0..1000.
  uint32 cpu_busy_permille = 6;
  uint64 memory_total_bytes = 7;
  // What the OS can give without swapping.
  uint64 memory_available_bytes = 8;
  // Local file systems that hold data (no pseudo file systems), at most 8.
  repeated DiskUsage disks = 9;
  // The size of the workspaces the node made (ADR-0064).
  uint64 workspaces_bytes = 10;
}

// ADR-0136: one file system of a machine.
message DiskUsage {
  // Where it is mounted, or the drive, as the OS names it.
  string mount = 1;
  uint64 total_bytes = 2;
  // What this user may still use.
  uint64 free_bytes = 3;
  // It holds the node's own data folder.
  bool holds_data = 4;
  // It holds the node's workspaces.
  bool holds_workspaces = 5;
}

// ADR-0061. Said when the node starts and whenever the set changes (the owner trusted or removed a device on the machine, an endorsement
// or a revocation was applied, an endorsement expired). The node is the event's producer. Ids only, sorted; never keys.
message NodeTrustedDevices {
  repeated string device_ids = 1;
}

message CheckoutDiscovered {
  string checkout_id = 1;
  string node_id = 2;
  // Machine-independent project identity (normalized remote + root commit).
  string project_id = 3;
  string path = 4;
}

message WorktreeCreated {
  string worktree_id = 1;
  string checkout_id = 2;
  string path = 3;
  string branch = 4;
}

message WorktreeRemoved {
  string worktree_id = 1;
}

message GitStatusChanged {
  string worktree_id = 1;
  uint32 files_changed = 2;
  uint32 insertions = 3;
  uint32 deletions = 4;
  string head_commit = 5;
}

message AgentStarted {
  string agent_id = 1;
  string project_id = 2;
  string node_id = 3;
  string worktree_id = 4;
  string kind = 5;
  IntegrationLevel level = 6;
  // ADR-0057: the agent that started this one through the mesh (`agent_start`), on the same node; empty when the user started it.
  // Old clients ignore it.
  string parent_agent_id = 7;
  // ADR-0104: this re-states an agent whose current process this node has announced before under this id (taken up from the
  // holder after a node restart, ADR-0079/0093, or re-stated in a resync, ADR-0054/0055). A hub keeps what it had summed for it
  // (tokens, reported cost, model, context level) instead of starting again from 0. Older hubs ignore it.
  bool same_process = 8;
  // ADR-0109: opaque 16-byte identity of the process run, empty when unknown. Preserved when restating the same live run.
  bytes run_id = 9;
  // ADR-0059: the launch options the agent was started with, and whether one of them skips permissions (the "does not ask"
  // badge for the agent's whole life). Old clients ignore them. (30-39 are kept for ADR-0059.)
  repeated string launch_options = 30;
  bool skips_permissions = 31;
  // ADR-0119: the standing grant a helper from another machine started under (empty when it was asked), and its parent there (the
  // machine is the hub-written origin, the agent that machine's word). `parent_agent_id` stays empty for such a helper.
  string grant_id = 32;
  string parent_node_id = 33;
  string parent_node_agent_id = 34;
  // ADR-0123: the ADR-0066 launch settings the agent was started with, as the node applied them (at most 8, each value at most 64
  // bytes); re-stated by a resume. Old clients ignore them.
  repeated LaunchSetting launch_settings = 35;
  // ADR-0122: the shared skills and MCP servers the agent was started with (at most 32).
  repeated SharedItemRef shared_items = 36;
}

message AgentStateChanged {
  string agent_id = 1;
  AgentState state = 2;
  // True when the agent or an adapter reported it; false when derived from the screen.
  bool reported = 3;
}

message AgentSessionReported {
  string agent_id = 1;
  string session_id = 2;
}

message AgentUsageReported {
  string agent_id = 1;
  string model = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  // ADR-0058: what the agent's own reported cost grew by, in micro-units of `currency`; absent when it reported none.
  optional uint64 cost_micros = 5;
  string currency = 6;
  // ADR-0058: the tokens the agent's context holds now and how many it can hold (a level, not a growth); 0 when not reported.
  uint64 context_tokens = 7;
  uint64 context_window = 8;
}

// ADR-0058: replaces the previous report for this agent.
message AgentSessionOptions {
  string agent_id = 1;
  repeated SessionOption modes = 2;
  repeated SessionOption models = 3;
  string current_mode = 4;
  string current_model = 5;
}

// ADR-0090: replaces the previous report for this agent (at most 64 options of 64 choices). `AgentSessionOptions` is still sent
// for the modes and models an agent offers, built from these when the agent gives them.
message AgentSessionConfig {
  string agent_id = 1;
  repeated SessionConfigOption options = 2;
}

// ADR-0090: one slash command (ACP `AvailableCommand`). Choosing it sends the ordinary prompt text `/name args` through `AgentPrompt`.
message AgentCommand {
  string name = 1;
  string description = 2;
  // What the command takes after its name, as the agent describes it; empty when it takes nothing.
  string input_hint = 3;
}

// ADR-0090: replaces the previous list for this agent (at most 100 commands).
message AgentCommands {
  string agent_id = 1;
  repeated AgentCommand commands = 2;
}

// ADR-0091: one observation of one plan window of a tool on a machine (`node_id` is the producer's own id, as for `NodeResources`). A
// neutral record: nothing else a tool reports (credits, balances, plan names, account ids, tokens) is part of it, and there is no
// price. The hub replaces the earlier observation of the same `(node_id, tool, window)`.
message AgentQuotaObserved {
  string node_id = 1;
  // The agent kind the numbers belong to (`codex`).
  string tool = 2;
  // `five_hour`, `seven_day`, or `minutes:<n>` for any other length; derived from the window's length, never from a field name.
  string window = 3;
  // 0 to 100, clamped by the node.
  uint32 used_percent = 4;
  // Milliseconds since the Unix epoch: when the window resets, bounded by the node (not more than a day in the past, not more than 31
  // days ahead; an observation outside is not sent).
  uint64 resets_at_ms = 5;
  // Where the node took it from: `file` (the tool's own file).
  string source = 6;
  // Milliseconds since the Unix epoch, node clock: when the node read it. Clients show its age and decide fresh, reset or unknown.
  uint64 observed_at_ms = 7;
}

message AgentExited {
  string agent_id = 1;
  int32 exit_code = 2;
}

// ADR-0060. Said once for each such agent after the node starts (and again in a resync announcement) until it is resumed, started
// again, or offered for longer than the node keeps it (14 days). The hub keeps it with the closed agents; an `AgentStarted` with the
// same id ends it.
message AgentInterrupted {
  string agent_id = 1;
  string kind = 2;
  string project_id = 3;
  // The folder it worked in (its workspace path, or its own worktree).
  string folder = 4;
  // ADR-0057: the agent that started it, on this node; empty when the user did.
  string parent_agent_id = 5;
  // The node has the agent's own session id and its kind can resume one: Resume continues the conversation. False: only a new
  // session in the same folder can be offered (Start again).
  bool resumable = 6;
  // Node clock, milliseconds since the Unix epoch.
  uint64 started_at_ms = 7;
  uint64 interrupted_at_ms = 8;
  // The last state the node saw.
  AgentState last_state = 9;
  // Its process outlived the node (a node killed without stopping its agents) and still runs: Resume is refused until it is
  // stopped (`agent.stop` ends exactly that process), so two processes never continue one conversation.
  bool still_running = 10;
  // ADR-0119 decision 10: as in `AgentStarted`.
  string parent_node_id = 11;
  string parent_node_agent_id = 12;
}

message AgentForgotten {
  string agent_id = 1;
}

// ADR-0073. The live view stops listing the machine and what it ran. A later connection of the same node (`NodeLink` up) lists it
// again; its agents closed before stay forgotten. `refused_return`: its certificates were revoked as well.
message NodeForgotten {
  string node_id = 1;
  bool refused_return = 2;
}

message TerminalOpened {
  string terminal_id = 1;
  string node_id = 2;
  TerminalPurpose purpose = 3;
  string agent_id = 4;
}

message TerminalTitleChanged {
  string terminal_id = 1;
  string title = 2;
}

message TerminalClosed {
  string terminal_id = 1;
}

message ApprovalRequested {
  string approval_id = 1;
  string agent_id = 2;
  // What the agent wants to do, for example "run_command" or "write_file".
  // ADR-0090 Amendment A: `agent.skip_permissions` is raised only by the node, when a window asked to switch a running agent to a mode
  // or option that makes it act without asking; `detail` is the node's own rendering (JSON, docs/specs/protocol.md) and the decision
  // is signed over `agora-approval-skip-v1`. The same kind of request, decided as any other (`ApprovalResolve`, `ApprovalResolved`).
  string action = 3;
  string detail = 4;
  uint64 expires_at_ms = 5;
  // ADR-0101: the answers the person may give, after the node's policy (empty: ONCE only), and with ALWAYS the agent's own name
  // for its always option (cleaned, at most 120 characters) and that option's exact id; both are covered by an ALWAYS signature.
  repeated ApprovalScope scopes = 6;
  string always_label = 7;
  string always_option_id = 8;
}

message ApprovalResolved {
  string approval_id = 1;
  bool approved = 2;
  // Device that signed the decision (ADR-0020).
  string signer_device_id = 3;
  // ADR-0057: for an approved `agent.start`, how many helpers of that kind in that folder the signed decision allows the asking
  // agent for its session (this start included). 0: this start only.
  uint32 helper_grant = 4;
  // ADR-0057: `ApprovalResolve.helpers_may_start` as signed.
  bool helpers_may_start = 5;
  // ADR-0101: the scope that was signed and delivered (UNSPECIFIED for a request that was not decided by a person).
  ApprovalScope scope = 6;
}

// ADR-0101: an agent was sent an "always" answer and holds it for its session (as the agent defines it). Written only after the
// adapter took the answer. Its records end when the agent ends, is stopped, started again or resumed.
message AgentAlwaysAllowed {
  string agent_id = 1;
  string approval_id = 2;
  // The request's action, as the node announced it (cleaned, bounded).
  string action = 3;
  string signer_device_id = 4;
  uint64 at_ms = 5;
}

// ADR-0094: what runs inside a plain terminal now. Only the node's foreground-process lookup sets it, never anything the terminal printed.
message AgentRunsInside {
  string agent_id = 1;
  // A kind id of the node's installed manifests (never `shell`); empty: no known program runs inside any more.
  string kind = 2;
}

message MessagePosted {
  string message_id = 1;
  string from_agent_id = 2;
  // An agent id or a channel name.
  string to = 3;
  string body = 4;
}

message TaskChanged {
  string task_id = 1;
  string project_id = 2;
  string title = 3;
  string claimed_by_agent_id = 4;
  bool done = 5;
}

// ADR-0095: written by the node that sent the prompt, after the claim and the send. The task's own move is `TaskChanged` as before.
message TaskDispatched {
  string project_id = 1;
  string task_id = 2;
  string agent_id = 3;
  // `TaskDispatch.by_user` as the node received it (the sender's word; the hub's audit row is the record of who asked).
  string by_user = 4;
  // Lowercase hex SHA-256 of the prompt's UTF-8 bytes; the prompt itself is not stored (task text is untrusted and may be large).
  string prompt_sha256 = 5;
  // The prompt waits behind the agent's running turn.
  bool queued = 6;
  // ADR-0059: the agent acts without asking for permission (a launch option or mode that skips it), as the node knows it.
  bool agent_skips_permissions = 7;
}

message LeaseGranted {
  string agent_id = 1;
  string path = 2;
  uint64 expires_at_ms = 3;
}

message LeaseReleased {
  string agent_id = 1;
  string path = 2;
}

message HandoffCreated {
  string task_id = 1;
  string from_agent_id = 2;
  string to_agent_id = 3;
  string summary = 4;
  repeated string refs = 5;
}

// ADR-0121: delivery state is independent of the task's current owner.
enum TaskHandoffDeliveryState {
  TASK_HANDOFF_DELIVERY_STATE_UNSPECIFIED = 0;
  TASK_HANDOFF_DELIVERY_STATE_PENDING = 1;
  TASK_HANDOFF_DELIVERY_STATE_DELIVERED = 2;
  TASK_HANDOFF_DELIVERY_STATE_FAILED = 3;
  TASK_HANDOFF_DELIVERY_STATE_UNRESOLVED = 4;
}

message TaskHandoffDeliveryChanged {
  // Opaque 16-byte id as lowercase hex.
  string delivery_id = 1;
  string project_id = 2;
  string task_id = 3;
  // Hub-wide key.
  string receiver_agent_id = 4;
  TaskHandoffDeliveryState state = 5;
  uint64 changed_at_ms = 6;
  string error_code = 7;
  // True only for an unresolved delivery whose reservation the owner cleared.
  bool acknowledged = 8;
}

// ADR-0057. `code` is the error code the asking agent received (`mesh.helper_limit`, `mesh.folder_not_allowed`,
// `mesh.rate_limited`, `node.policy_denied`, ...); `kind` and `folder` are what it asked for. The prompt is not repeated here.
message AgentStartRefused {
  string agent_id = 1;
  string kind = 2;
  string folder = 3;
  string code = 4;
}

message FilesChanged {
  string worktree_id = 1;
  // Batched, relative to the worktree root.
  repeated string paths = 2;
}

// ADR-0026: hub -> producer on the events stream. Cumulative: every event of that producer with seq <= up_to_seq is
// durably stored and may be dropped.
message EventAck {
  uint64 up_to_seq = 1;
}

// A directory used by one or more agents. User-owned directories are never Git worktrees by implication.
message WorkspaceRegistered {
  string workspace_id = 1;
  string node_id = 2;
  string project_id = 3;
  string path = 4;
  string git_root = 5;
  string branch = 6;
  bool managed_worktree = 7;
  uint32 files_changed = 8;
}
message AgentWorkspaceBound {
  string agent_id = 1;
  string workspace_id = 2;
}

message WorkspaceStatusChanged {
  string workspace_id = 1;
  uint32 files_changed = 2;
  uint32 insertions = 3;
  uint32 deletions = 4;
  string head_commit = 5;
}

enum TaskReviewState {
  TASK_REVIEW_STATE_UNSPECIFIED = 0;
  TASK_REVIEW_STATE_PENDING = 1;
  TASK_REVIEW_STATE_ACCEPTED = 2;
  TASK_REVIEW_STATE_RETURNED = 3;
}

// ADR-0125: the latest report and review decision. Report text is fetched separately.
message TaskReview {
  uint64 report_revision = 1;
  string reporting_agent_id = 2;
  uint64 reported_at_ms = 3;
  TaskReviewState state = 4;
  string reviewer_id = 5;
  uint64 decided_at_ms = 6;
}

message TaskReviewChanged {
  string project_id = 1;
  string task_id = 2;
  TaskReview review = 3;
}

message TaskParentLinked {
  string project_id = 1;
  string task_id = 2;
  string parent_task_id = 3;
}

message TaskReviewEnabled {
  string project_id = 1;
}

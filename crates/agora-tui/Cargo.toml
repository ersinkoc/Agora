[package]
name = "agora-tui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
agora-core = { path = "../agora-core" }
agora-protocol = { path = "../agora-protocol", features = ["ws"] }
agora-vt = { path = "../agora-vt" }
agora-i18n = { path = "../agora-i18n" }
# The hub client (ADR-0043): TLS to the hub with only its CA trusted, the same crates the node's uplink uses; serde_json reads the
# sign-in answer.
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
prost = "0.14"
serde_json = "1"
# This device's ES256 key for answering approvals (ADR-0028); already in the tree through rustls.
ring = "0.17"
# ADR-0063: the terminal client draws with ratatui over crossterm (both MIT; exact versions at least two weeks old; only what is used).
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false }

[dev-dependencies]
agora-node = { path = "../agora-node" }

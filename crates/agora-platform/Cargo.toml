[package]
name = "agora-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# openpty, ioctl, killpg: the system calls a PTY needs. This crate is the only place allowed to use them.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The local control channel is a named pipe and the terminals are ConPTY (ADR-0045): raw bindings from Microsoft, no code of its own;
# only the groups used are enabled, and no other platform compiles it. Already in the tree through tokio and ring.
windows-sys = { version = "0.61", features = [
  # Single-entry directory queries keep checked-handle traversal lazy on Windows.
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[package]
name = "agora-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# openpty, ioctl, killpg: the system calls a PTY needs. This crate is the only place allowed to use them.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The local control channel is a named pipe and the terminals are ConPTY (ADR-0045): raw bindings from Microsoft, no code of its own;
# only the groups used are enabled, and no other platform compiles it. Already in the tree through tokio and ring.
windows-sys = { version = "0.61", features = [
  # Single-entry directory queries keep checked-handle traversal lazy on Windows.
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  # The node's hidden window that hears the session end (herdr G11, `windows::catch_session_end`): WNDCLASSW holds a brush handle.
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  # Listing the machine's own addresses (`interface_addresses`): GetAdaptersAddresses and the types it fills.
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  # `GetModuleHandleW` for the session-end window's class.
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  # The session-end window and its message loop (herdr G11: WM_QUERYENDSESSION / WM_ENDSESSION reach only a process with a window).
  "Win32_UI_WindowsAndMessaging",
] }

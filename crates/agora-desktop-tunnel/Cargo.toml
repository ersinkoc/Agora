[package]
name = "agora-desktop-tunnel"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The desktop shell's connection to the hub (ADR-0048): a loopback tunnel that trusts only the hub's own CA"

[lints]
workspace = true

[dependencies]
# The same TLS stack the terminal client and the node already use; nothing new enters the tree.
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"

[dev-dependencies]
agora-hub = { path = "../agora-hub" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }

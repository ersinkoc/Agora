[package]
name = "agora-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Generated message types and the wire codec (ADR-0009, ADR-0010).
prost = "0.14"
# JSON-RPC envelope for the adapter protocol (ADR-0010).
serde_json = "1"
# WebSocket carrying frames (ADR-0011), shared by the hub and the node's uplink; behind the `ws` feature so the
# message types stay light for users that do not connect (adapters, the schema tools).
tokio = { version = "1", optional = true, features = ["net", "io-util", "time", "rt", "macros"] }
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink"] }

[features]
ws = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]

[dev-dependencies]
# Reflection + proto3 JSON mapping for golden fixtures in both encodings (ADR-0010).
prost-reflect = { version = "0.16", features = ["serde"] }
serde = "1"

[build-dependencies]
prost = "0.14"
# Pure-Rust protobuf compiler, so contributors do not need `protoc` (ADR-0009).
protox = "0.10"
prost-build = "0.14"

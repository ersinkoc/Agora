[package]
name = "agora-adapters"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
agora-core = { path = "../agora-core" }
agora-protocol = { path = "../agora-protocol" }
agora-vt = { path = "../agora-vt" }
# Manifests are TOML (docs/specs/agent-manifest.md); serde derives the typed structs.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# Screen rules are regular expressions from manifests; the crate guarantees linear-time matching, so a
# community manifest cannot hang the node with a pathological pattern.
regex = "1"
# Adapter protocol messages are JSON-RPC (docs/specs/adapter-protocol.md); serde_json parses them.
serde_json = "1"

[dev-dependencies]
# The host tests run the fake adapter (a test-only crate) as the adapter process.
agora-fake-agent = { path = "../agora-fake-agent" }

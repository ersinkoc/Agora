[package]
name = "agora"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The supervisor's restart rule (ADR-0062 item 8) is plain domain data; already in the tree through agora-node.
agora-core = { path = "../agora-core" }
agora-hub = { path = "../agora-hub" }
agora-adapters = { path = "../agora-adapters" }
agora-node = { path = "../agora-node" }
agora-tui = { path = "../agora-tui" }
# The desktop app's fingerprint of the hub CA (ADR-0048); `agora hub fingerprint` prints the same value.
agora-desktop-tunnel = { path = "../agora-desktop-tunnel" }
agora-i18n = { path = "../agora-i18n" }
agora-protocol = { path = "../agora-protocol" }
agora-platform = { path = "../agora-platform" }
# The mesh bridge reads a client's line as the node does (JSON-RPC errors, batches); already in the tree through agora-node.
agora-mesh = { path = "../agora-mesh" }
# `agora hub run` serves on tokio (ADR-0013) with TLS; getrandom makes the client token.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
getrandom = "0.2"
# The mesh bridge reads a JSON-RPC batch to answer each request in it; already in the tree through agora-protocol.
serde_json = "1"
# `agora update` checks the downloaded binary against its published SHA-256; already in the tree through rustls.
ring = { version = "0.17", default-features = false }

[dev-dependencies]
# The panel forwarder's loopback tests drive sockets directly.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "io-util", "macros"] }
# Builds raw protocol frames in the stdio bridge test.
prost = "0.14"
# The agent id type used by the hub link test.
agora-core = { path = "../agora-core" }
# Plays the user's own terminal in the attach test (what `terminal attach` leaves it in); already in the tree through agora-node.
agora-vt = { path = "../agora-vt" }
# A signed-in client dials the hub over TLS in the routed-command test.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Seeds passkeys and injects a failure into the hub's database in the password command tests; already in the tree through agora-hub.
rusqlite = { version = "0.42", features = ["bundled"] }

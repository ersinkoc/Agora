[package]
name = "agora"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
agora-hub = { path = "../agora-hub" }
agora-adapters = { path = "../agora-adapters" }
agora-node = { path = "../agora-node" }
agora-tui = { path = "../agora-tui" }
agora-i18n = { path = "../agora-i18n" }
agora-protocol = { path = "../agora-protocol" }
agora-platform = { path = "../agora-platform" }
# `agora hub run` serves on tokio (ADR-0013) with TLS; getrandom makes the client token.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
getrandom = "0.2"

[dev-dependencies]
# Signs grants with a real P-256 key in the signed-commands test (ADR-0041).
ring = { version = "0.17", default-features = false }
# Builds raw protocol frames in the stdio bridge test.
prost = "0.14"
# Reads the MCP config the node wrote, in the injection test.
serde_json = "1"
# The agent id type used by the hub link test.
agora-core = { path = "../agora-core" }
# Registers mesh agents in the cross-node message test.
agora-mesh = { path = "../agora-mesh" }
# A signed-in client dials the hub over TLS in the routed-command test.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

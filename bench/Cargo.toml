[package]
name = "agora-bench"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Result files are JSON stored per commit as CI artifacts (ADR-0022).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The real hot path: fake agent output through a PTY into the VT backend (ADR-0022, P2-04).
agora-platform = { path = "../crates/agora-platform" }
agora-vt = { path = "../crates/agora-vt" }
agora-fake-agent = { path = "../crates/agora-fake-agent" }
# Footprint measurement runs a real node in-process (P2-15).
agora-node = { path = "../crates/agora-node" }
agora-adapters = { path = "../crates/agora-adapters" }
agora-core = { path = "../crates/agora-core" }
agora-protocol = { path = "../crates/agora-protocol" }

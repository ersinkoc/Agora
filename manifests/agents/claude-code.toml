kind = "claude-code"
display_name = "Claude Code"
version = "2026.11.09.1"
min_engine = 1

[process]
names = ["claude"]
launch = ["claude"]

[accounts]
login = ["claude", "auth", "login"]
status = ["claude", "auth", "status"]

[mcp]
# `claude --mcp-config <file>` (checked against Claude Code 2.1.319).
method = "cli_flag"
path = ".agora-mcp.json"
format = "json"
flag = ["--mcp-config", "{config_file}"]

[resume]
argv = ["claude", "--resume", "{session_id}"]

[usage]
# Claude Code writes one JSON line per message to ~/.claude/projects/<cwd>/<session>.jsonl (checked on 2.1.319, ADR-0042). A message
# can be on several lines with the same usage, so it is counted once by `message.id`; cached prompt tokens count as input.
source = "file"

[usage.file]
glob = "{home}/.claude/projects/*/*.jsonl"
format = "jsonl"
select = { path = "type", equals = "assistant" }
cwd = "cwd"
model = "message.model"
input = "message.usage.input_tokens"
output = "message.usage.output_tokens"
cache_read = "message.usage.cache_read_input_tokens"
cache_write = "message.usage.cache_creation_input_tokens"
dedupe = "message.id"
mode = "delta"

# Screen rules, from screens captured on Claude Code 2.1.319 (manifests/agents/fixtures/claude-code/).
[[rules]]
id = "trust_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
all = [{ contains = "Yes, I trust this folder" }, { contains = "Enter to confirm" }]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
all = [{ contains = "Do you want to proceed?" }, { contains = "Esc to cancel" }]

[[rules]]
id = "esc_to_interrupt"
state = "working"
priority = 800
region = "bottom_non_empty_lines(12)"
contains = "esc to interrupt"

[[rules]]
id = "prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
regex = '^\s*❯'

# ADR-0057: the input box is empty (or shows its placeholder) between its two rules, with the mode footer below: only then does the
# node type a helper's first prompt. Stricter than `prompt_box`, whose `❯` also marks the selected row of any menu.
[[ready]]
id = "empty_prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
regex = '^─{20,}\n❯[^\S\n]*(Try "[^\n]*")?[^\S\n]*\n─{20,}$'
all = [{ contains = "shift+tab to cycle" }]
not = [{ contains = "esc to interrupt" }, { contains = "Enter to confirm" }, { contains = "Esc to cancel" }]

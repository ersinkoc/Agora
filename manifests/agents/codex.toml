kind = "codex"
display_name = "Codex"
version = "2026.11.11.2"
min_engine = 1

[process]
names = ["codex"]
launch = ["codex"]

[accounts]
login = ["codex", "login"]
status = ["codex", "login", "status"]

[mcp]
# Codex takes MCP servers as config overrides (`codex -c mcp_servers.NAME.command=... -c mcp_servers.NAME.args=[...]`, checked
# with `codex mcp list` on codex-cli 0.167.0), so no file is written.
method = "cli_flag"
flag = [
  "-c", "mcp_servers.agora-mesh.command={mcp_command_toml}",
  "-c", 'mcp_servers.agora-mesh.args=["mesh","stdio","--socket",{socket_toml}]',
]

[resume]
argv = ["codex", "resume", "{session_id}"]

[usage]
# Codex appends `token_count` events with the running total of the session to ~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl
# (checked on codex-cli 0.167.0, ADR-0042); the model comes from the `turn_context` line before them. `input_tokens` already
# includes the cached part.
source = "file"

[usage.file]
glob = "{home}/.codex/sessions/*/*/*/*.jsonl"
format = "jsonl"
select = { path = "payload.type", equals = "token_count" }
cwd = "payload.cwd"
model = "payload.model"
input = "payload.info.total_token_usage.input_tokens"
output = "payload.info.total_token_usage.output_tokens"
mode = "total"

# Screen rules, from screens captured on codex-cli 0.167.0 (manifests/agents/fixtures/codex/).
# The prompt box can be on screen while Codex works, so the working rule outranks it.
[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
all = [{ contains = "Would you like to run the following command?" }, { contains = "esc to cancel" }]

# On the first start after a lifecycle hook was added to the user's config, Codex opens a review dialog (`t trust all`) that waits
# for the user; its menu rows start with `›`, which the prompt box rule below would take for the idle prompt.
[[rules]]
id = "hook_review"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(12)"
all = [{ contains = "t trust all" }, { contains = "enter review" }]

# In a folder Codex has not seen, it first asks whether to trust it ("Trust this folder?", `› 1. Trust and continue`) and waits;
# the `›` row would otherwise read as the idle prompt. Captured on codex-cli 0.167.1 (fixtures/codex/trust.screen).
# On a short terminal Codex draws only the top of the dialog (no menu, no "Trust this folder?" in the bottom rows: trust@24x20),
# so the phrases are taken from its last sentences, which are on screen at every size.
[[rules]]
id = "trust_prompt"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(12)"
all = [{ contains = "trust these files" }, { contains = "trust decision" }]

[[rules]]
id = "esc_to_interrupt"
state = "working"
priority = 800
region = "bottom_non_empty_lines(12)"
contains = "esc to interrupt"

[[rules]]
id = "prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
regex = '^\s*› '

# ADR-0057: the input box shows its placeholder (it is empty) above the shortcuts footer: only then does the node type a helper's
# first prompt. Stricter than `prompt_box`, whose `› ` also marks the selected row of a menu.
[[ready]]
id = "empty_prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
regex = '^›[^\S\n]+Ask Codex to do anything[^\S\n]*$'
all = [{ contains = "? for shortcuts" }]
not = [{ contains = "esc to interrupt" }, { contains = "esc to cancel" }, { contains = "enter continue" }]

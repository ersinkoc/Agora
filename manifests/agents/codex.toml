kind = "codex"
display_name = "Codex"
version = "2026.11.20.1"
min_engine = 5
# ADR-0057: before Enter, the last `› ` row (the input box) must hold the typed prompt (and only it), above the shortcuts footer and
# with no dialog. A prompt long enough to wrap does not match, so it is left for the user rather than sent half-checked.
input_box = '^›[^\S\n]+([^\n]*?)[^\S\n]*$'

[process]
names = ["codex"]
launch = ["codex"]

# ADR-0059: chosen in the start window, never preselected; the node's `skip_permissions` policy decides whether it may be used.
# `--dangerously-bypass-approvals-and-sandbox` ("Skip all confirmation prompts and execute commands without sandboxing") checked with
# `codex --help` and `codex resume --help` on codex-cli 0.167.1. It also turns off Codex's own sandbox: the node's confinement
# (`sandbox = worktree`, and `skip_permissions = confined_only`) is what still keeps it in its folder.
[[launch.option]]
id = "skip-permissions"
label = "option-skip-permissions"
args = ["--dangerously-bypass-approvals-and-sandbox"]
skips_permissions = true

# ADR-0066: chosen when an agent starts; the node checks the value and puts it into one argument. Checked on codex-cli 0.169.0:
# `codex --help` lists `-m, --model <MODEL>` and `-c, --config <key=value>`; `model_reasoning_effort` is the config key Codex reads
# (also in ~/.codex/config.toml), and its own help text gives the levels "`low`, `medium` (default), `high`, `xhigh`, or `max`" (and
# says `none` and `minimal` are not supported).
[[launch.setting]]
id = "model"
label = "setting-model"
args = ["-m", "{value}"]

[[launch.setting]]
id = "effort"
label = "setting-effort"
args = ["-c", "model_reasoning_effort=\"{value}\""]
values = ["low", "medium", "high", "xhigh", "max"]
default = "medium"

[accounts]
login = ["codex", "login"]
status = ["codex", "login", "status"]
# ADR-0084: what the agent reads for its login (checked against the installed version, see the ADR); the owner stores one with
# `agora node secret set NAME` and lists it in the node policy as `credentials.codex = NAME`.
credential_env = ["OPENAI_API_KEY"]

[mcp]
# Codex takes MCP servers as config overrides (`codex -c mcp_servers.NAME.command=... -c mcp_servers.NAME.args=[...]`, checked
# with `codex mcp list` on codex-cli 0.167.0), so no file is written.
method = "cli_flag"
flag = [
  "-c", "mcp_servers.agora-mesh.command={mcp_command_toml}",
  "-c", 'mcp_servers.agora-mesh.args=["mesh","stdio","--socket",{socket_toml}]',
]

[resume]
argv = ["codex", "resume", "{session_id}"]
# ADR-0060 Amendment A: as for Claude Code (checked on codex-cli 0.169.0: `codex resume <id> "<prompt>"`).
continue_argv = ["codex", "resume", "{session_id}", "{continue}"]
continue = "This session was cut off by a restart of the machine or of Agora. Before anything else, check the state of what you were doing (the files, the running tasks, git status), then carry on where you stopped."

[session.file]
# ADR-0060: no flag sets Codex's session id. The first line of ~/.codex/sessions/YYYY/MM/DD/rollout-<time>-<id>.jsonl is
# `{"type":"session_meta","payload":{"id":...,"cwd":...}}` (checked on codex-cli 0.167.0 and 0.167.1); the node takes the newest one
# written after the agent started in its folder, and none when two Codex agents started in that folder at about the same time.
glob = "{home}/.codex/sessions/*/*/*/rollout-*.jsonl"
select = { path = "type", equals = "session_meta" }
id = "payload.id"
cwd = "payload.cwd"

[usage]
# Codex appends `token_count` events with the running total of the session to ~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl
# (checked on codex-cli 0.167.0, ADR-0042); the model comes from the `turn_context` line before them. `input_tokens` already
# includes the cached part.
source = "file"

[usage.file]
glob = "{home}/.codex/sessions/*/*/*/*.jsonl"
format = "jsonl"
select = { path = "payload.type", equals = "token_count" }
cwd = "payload.cwd"
model = "payload.model"
input = "payload.info.total_token_usage.input_tokens"
output = "payload.info.total_token_usage.output_tokens"
mode = "total"

# ADR-0091: the plan limits Codex reports on its `token_count` lines (`rate_limits.primary` and `.secondary`; the secondary may be absent
# or null; as ADR-0091 describes it from Codex's own files and community sources, undocumented and not checked against a real file when this was
# written, so a missing or odd value just means "unknown"). A window is named
# by its length in minutes (300 is the 5 hour window, 10080 the weekly one), never by `primary` or `secondary`; `resets_at` is a Unix
# time in seconds. `credits`, `plan_type` and everything else on the line are not mapped, so they never leave the file.
[quota]
# The line's own time (RFC 3339), used to stamp what is read from the start of a file (a resumed session), so an old report is not shown as new.
at = "timestamp"
[[quota.window]]
percent = "payload.rate_limits.primary.used_percent"
minutes = "payload.rate_limits.primary.window_minutes"
resets = "payload.rate_limits.primary.resets_at"

[[quota.window]]
percent = "payload.rate_limits.secondary.used_percent"
minutes = "payload.rate_limits.secondary.window_minutes"
resets = "payload.rate_limits.secondary.resets_at"

# Screen rules, from screens captured on codex-cli 0.167.0 (manifests/agents/fixtures/codex/).
# The prompt box can be on screen while Codex works, so the working rule outranks it.
[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
all = [{ contains = "Would you like to run the following command?" }, { contains = "esc to cancel" }]

# On the first start after a lifecycle hook was added to the user's config, Codex opens a review dialog (`t trust all`) that waits
# for the user; its menu rows start with `›`, which the prompt box rule below would take for the idle prompt.
[[rules]]
id = "hook_review"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(12)"
all = [{ contains = "t trust all" }, { contains = "enter review" }]

# The startup review also has a numbered menu (codex-cli 0.167.0, macOS): its selected row is not an idle input box.
[[rules]]
id = "hook_review_menu"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(12)"
all = [{ contains = "Hooks need review" }, { contains = "enter confirm" }]

# In a folder Codex has not seen, it first asks whether to trust it ("Trust this folder?", `› 1. Trust and continue`) and waits;
# the `›` row would otherwise read as the idle prompt. Captured on codex-cli 0.167.1 (fixtures/codex/trust.screen).
# On a short terminal Codex draws only the top of the dialog (no menu, no "Trust this folder?" in the bottom rows: trust@24x20),
# so the phrases are taken from its last sentences, which are on screen at every size.
[[rules]]
id = "trust_prompt"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(12)"
all = [{ contains = "trust these files" }, { contains = "trust decision" }]

# Before it runs a tool of an MCP server (the mesh's `agora-mesh` among them), Codex asks for approval in a numbered menu
# ("Allow the agora-mesh MCP server to run tool \"agents_list\"?", `› 1. Allow`, `enter to submit | esc to cancel`) and waits;
# the `›` row would otherwise read as the idle prompt. Captured on codex-cli 0.169.0 (fixtures/codex/mcp_tool_approval.screen).
[[rules]]
id = "mcp_tool_approval"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
all = [{ contains = "MCP server to run tool" }, { contains = "esc to cancel" }]

[[rules]]
id = "esc_to_interrupt"
state = "working"
priority = 800
region = "bottom_non_empty_lines(12)"
contains = "esc to interrupt"

# The terminal title (OSC 0/2), from the screens captured on codex-cli 0.167.0: `[ ! ] Action Required | …` (blinking with
# `[ . ]`) while it waits for an approval, a Braille spinner in front while a turn runs, the folder name otherwise. Both sit below
# the dialog rules (900+) and `esc_to_interrupt` (800), so a title never outranks a dialog or a running turn on screen (no captured
# approval screen shows "esc to interrupt"), and above `prompt_box` (100), whose `›` is on screen during dialogs and turns too: a
# title left over an idle screen reads as blocked or working until Codex rewrites it (it does: `idle.screen` ends on `work3`).
# Every captured screen agrees with them (`title_rules_agree_with_every_captured_screen`).
[[rules]]
id = "title_action_required"
state = "blocked"
priority = 795
region = "title"
regex = '^\[ [!.] \] Action Required'

[[rules]]
id = "title_spinner"
state = "working"
priority = 790
region = "title"
regex = '^[\x{2800}-\x{28FF}] '

[[rules]]
id = "prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
regex = '^\s*› '

# ADR-0057: the input box shows its placeholder (it is empty) above the shortcuts footer: only then does the node type a helper's
# first prompt. Stricter than `prompt_box`, whose `› ` also marks the selected row of a menu.
[[ready]]
id = "empty_prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
regex = '^›[^\S\n]+Ask Codex to do anything[^\S\n]*$'
all = [{ contains = "? for shortcuts" }]
not = [{ contains = "esc to interrupt" }, { contains = "esc to cancel" }, { contains = "enter continue" }]


[[typed]]
id = "typed_prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
# The shortcuts footer is checked two lines under the box (the status line between), not anywhere on screen.
regex = '^›[^\S\n]+\S[^\n]*\n[^\n]*\n[^\n]*\? for shortcuts[^\n]*\z'
all = [{ contains = "? for shortcuts" }]
# A numbered row (`› 1. …`) is a menu's selection, not typed text.
not = [{ contains = "esc to interrupt" }, { contains = "esc to cancel" }, { contains = "enter continue" }, { contains = "Press enter to confirm" }, { contains = "Ask Codex to do anything" }, { contains = "t trust all" }, { regex = '^›[^\S\n]+[0-9]+\. ' }]

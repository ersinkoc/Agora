kind = "wrongstack"
display_name = "WrongStack"
version = "2026.11.09.1"
min_engine = 1
# ADR-0057: before Enter, the input box under the idle header must hold the typed prompt (and only it), with no approval on screen.
input_box = 'idle ─╮[^\n]*\n│[^\S\n]*❯[^\S\n]?([^│\n]*?)[^\S\n]*│'

[process]
names = ["wstack", "wrongstack"]
# `--skip` answers every startup question from saved choices (otherwise a launcher menu and a "no project manifest" question
# wait for a key); `--tui` is the terminal UI the screen rules below were captured from (checked against WrongStack 1.5.3).
launch = ["wstack", "--skip", "--tui"]

[mcp]
# `wstack --mcp-config <file|json>` takes extra MCP servers for the run and accepts a `.mcp.json` (WrongStack 1.5.3 `--help`).
method = "cli_flag"
path = ".agora-mcp.json"
format = "json"
flag = ["--mcp-config", "{config_file}"]

[resume]
argv = ["wstack", "--resume", "{session_id}"]

[usage]
# WrongStack appends one `llm_response` line per model call to ~/.wrongstack/projects/<project>/sessions/<day>/sess_*.jsonl (checked
# on WrongStack 1.5.3, ADR-0042); `input` there does not include `cacheRead`, which the node adds. The directory comes from the
# `session_start` line (`checkout`), which has no usage and only gives the file its owner.
source = "file"

[usage.file]
glob = "{home}/.wrongstack/projects/*/sessions/*/*.jsonl"
format = "jsonl"
select = { path = "type", equals = "llm_response" }
cwd = "checkout"
model = "model"
input = "usage.input"
output = "usage.output"
cache_read = "usage.cacheRead"
mode = "delta"

# Screen rules, from screens captured on WrongStack 1.5.3 (manifests/agents/fixtures/wrongstack/). The input box has a title bar
# that says `idle` when nothing runs and shows a spinner and a verb with an ellipsis (`⠙ bamboozling…`) while a turn runs; side
# panels and a swarm view can push it up the screen, so the region is wider than for the other agents.
[[rules]]
id = "approval_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(24)"
all = [{ contains = "APPROVAL REQUIRED" }, { contains = "[y]es [n]o" }]

[[rules]]
id = "title_spinner"
state = "working"
priority = 800
region = "bottom_non_empty_lines(24)"
regex = 'WRONGSTACK v[0-9.]+ .*… +─╮'

[[rules]]
id = "prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(24)"
regex = 'WRONGSTACK v[0-9.]+ .*idle ─╮'

# ADR-0057: the input box under the idle header is empty: only then does the node type a helper's first prompt.
[[ready]]
id = "empty_prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
regex = 'WRONGSTACK v[0-9.]+ .*idle ─╮[^\n]*\n│[^\S\n]+❯[^\S\n]+│'
all = [{ contains = "Enter send" }]
not = [{ contains = "APPROVAL REQUIRED" }]


[[typed]]
id = "typed_prompt_box"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
regex = 'WRONGSTACK v[0-9.]+ .*idle ─╮[^\n]*\n│[^\S\n]+❯[^\S\n]+[^\s│]'
all = [{ contains = "Enter send" }]
not = [{ contains = "APPROVAL REQUIRED" }]

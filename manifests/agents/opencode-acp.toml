kind = "opencode-acp"
display_name = "opencode (structured)"
version = "2026.11.13.1"
min_engine = 1

# L2: opencode as an Agent Client Protocol server over stdio (`opencode acp`, seen in opencode 1.1.59's `--help` on macOS). Not yet
# run through `agora acp-bridge` against the real program: the macOS agent is asked to do that before this counts as verified.
# The node runs it through the bridge, so there is no terminal: the transcript, plans, diffs and permission requests arrive as
# chat items and approvals. opencode's own terminal screen would be a separate L1 kind once its screens are captured.
# opencode writes its errors (a provider's refusal, an expired login) to stderr only with `--print-logs`; the bridge passes what it wrote
# during a failed or empty turn along with the notice (ADR-0058), so it is asked for. `--log-level` is left out on purpose: 1.x accepts only
# the upper case (`ERROR`) and 2.x only the lower case (`error`), so no spelling works for both; the default level is INFO and the bridge keeps
# the last lines (the error is among them).
# opencode 2.x (seen with 2.2.6 on Windows): `session/new` takes 9.5 to 12 s and now and then fails with -32603 `ServiceUnavailableError`, because
# opencode's own `/api/model/default` answered 503 (its default model/provider); the start then fails as `adapter.agent_refused` (stage `session`)
# and the notice carries the agent's message. opencode 2.x logs such a failure only as an INFO line with `http.status=503`, which the bridge's
# stderr tail keeps.
[structured]
acp = { argv = ["opencode", "acp", "--print-logs"] }

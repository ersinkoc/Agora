# cargo-deny for the desktop shell only (ADR-0048 decision 7): the main workspace's policy plus what Tauri's tree needs, each with its reason.
[advisories]
yanked = "deny"
ignore = [
    # `proc-macro-error` is unmaintained; it is a build-time proc-macro pulled in by gtk-rs (Tauri's Linux webview binding), runs on the
    # developer's machine at compile time only and ships no code. Revisit when gtk-rs drops it.
    "RUSTSEC-2024-0370",
    # `zvariant`, `zbus_names` and `zvariant_derive` 5.x are "unmaintained" only because zbus 6 took them in as its own modules; no
    # vulnerability is reported. They come with zbus 5, which Tauri's notification plugin (2.8.1) uses for its Linux D-Bus connection
    # (and `notify-rust` 4.18, kept there so one zbus is built). Revisit when the plugin moves to zbus 6; then `cargo update` here
    # removes them.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# MPL-2.0 is file-level copyleft: used unmodified as a dependency (cssparser and its siblings, Mozilla's CSS parser, which Tauri's
# build tooling reads CSP and assets with) it places no obligation on this project's own files.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Recorded, not ignored: RUSTSEC-2024-0429 (`glib` 0.18.5, unsound `VariantStrIter`) reaches this lockfile through gtk-rs, which Tauri 2 uses for its
# Linux webview. `cargo deny check` does not fail on it (cargo-deny reports unsound advisories only for workspace crates by default), so there is no
# `ignore` entry to keep. Agora's code does not call `VariantStrIter`, and the desktop shell is built for Linux only for testing, not shipped.
# It goes away when Tauri and wry move to gtk-rs 0.20 (glib 0.20 or newer); then `cargo update` in this directory removes it. If a future
# cargo-deny starts failing on it, add it to `ignore` above with this same reason.
